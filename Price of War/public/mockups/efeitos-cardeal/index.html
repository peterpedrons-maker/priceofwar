<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Efeitos do Cardeal</title>
<style>
  :root { --gold:#e6c36a; --ink:#1a1410; --panel:#2a2018; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#0d0a07; color:#eadfc6; font-family: Georgia, 'Times New Roman', serif; overflow:hidden; touch-action: manipulation; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { padding:8px 12px 4px; text-align:center; flex:none; }
  header h1 { font-size:15px; letter-spacing:.14em; margin:0; color:var(--gold); text-transform:uppercase; }
  header p { margin:2px 0 0; font-size:11px; color:#a99d84; min-height:28px; line-height:1.25; }
  #holder { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #stage { position:relative; width:390px; height:640px; flex:none; transform-origin:center center; border-radius:10px; overflow:hidden; background:#000; box-shadow:0 0 0 1px #3a2c1c, 0 10px 40px #000; }
  #bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.82) saturate(.95); }
  .slot { position:absolute; width:64px; height:94px; transform:translate(-50%,-50%); border-radius:6px; border:1px dashed rgba(255,255,255,.12); background:rgba(0,0,0,.18); }
  .card { position:absolute; width:64px; transform:translate(-50%,-50%); border-radius:6px; box-shadow:0 4px 10px rgba(0,0,0,.7); user-select:none; -webkit-user-drag:none; will-change:transform, filter; }
  .card.big { width:68px; }
  .card.hit { animation: hit .5s ease-out; }
  .card.hit2 { animation: hit2 .5s ease-out; }
  @keyframes hit  { 0%{transform:translate(-50%,-50%) scale(1); filter:brightness(1)} 10%{transform:translate(calc(-50% - 7px),calc(-50% + 4px)) scale(.94) rotate(-4deg); filter:brightness(2.6) saturate(.6)} 30%{transform:translate(calc(-50% + 6px),calc(-50% - 3px)) scale(.97) rotate(3deg); filter:brightness(1.6)} 55%{transform:translate(calc(-50% - 3px),-50%) rotate(-1.5deg); filter:brightness(1.2)} 100%{transform:translate(-50%,-50%) scale(1) rotate(0); filter:brightness(1)} }
  @keyframes hit2 { 0%{transform:translate(-50%,-50%)} 12%{transform:translate(calc(-50% + 7px),calc(-50% + 3px)) rotate(4deg); filter:brightness(2.4)} 35%{transform:translate(calc(-50% - 5px),calc(-50% - 2px)) rotate(-3deg); filter:brightness(1.5)} 60%{transform:translate(calc(-50% + 2px),-50%)} 100%{transform:translate(-50%,-50%) rotate(0); filter:brightness(1)} }
  .card.windup { animation: windup .42s ease-in-out; }
  @keyframes windup { 0%{transform:translate(-50%,-50%)} 55%{transform:translate(-50%,calc(-50% + 14px)) scale(.96)} 75%{transform:translate(-50%,calc(-50% - 10px)) scale(1.08)} 100%{transform:translate(-50%,-50%)} }
  .card.kick { animation: kick .4s ease-out; }
  @keyframes kick { 0%{transform:translate(-50%,-50%)} 20%{transform:translate(-50%,calc(-50% + 9px)) scale(.97)} 100%{transform:translate(-50%,-50%)} }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .num { position:absolute; transform:translate(-50%,-50%); font:900 30px/1 Georgia,serif; color:#fff; letter-spacing:-.02em; pointer-events:none;
         text-shadow: 0 0 2px #7a1208, 0 2px 0 #b3200f, 0 -1px 0 #b3200f, 2px 0 0 #b3200f, -2px 0 0 #b3200f, 0 4px 6px rgba(0,0,0,.8); -webkit-text-stroke: 1px #c0240f; animation: num 1.5s ease-out forwards; }
  .numg { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; pointer-events:none; animation: num 1.5s ease-out forwards; }
  .numg .nb { position:absolute; left:50%; top:50%; max-width:none; transform:translate(-50%,-50%) scale(.2); opacity:0; animation: nb .55s ease-out forwards; }
  @keyframes nb { 0%{opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-14deg)} 35%{opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(0)} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.55) rotate(8deg)} }
  .num.heal { color:#eaffd0; text-shadow: 0 0 2px #1f6a14, 0 2px 0 #2f9a1e, 0 -1px 0 #2f9a1e, 2px 0 0 #2f9a1e, -2px 0 0 #2f9a1e, 0 4px 6px rgba(0,0,0,.8); -webkit-text-stroke: 1px #2f9a1e; }
  .num.buff { color:#fff3cf; text-shadow: 0 0 2px #7a4a08, 0 2px 0 #c58a14, 0 -1px 0 #c58a14, 2px 0 0 #c58a14, -2px 0 0 #c58a14, 0 4px 6px rgba(0,0,0,.8); -webkit-text-stroke: 1px #c58a14; }
  @keyframes num { 0%{transform:translate(-50%,-50%) scale(.3); opacity:0} 10%{transform:translate(-50%,-62%) scale(1.5); opacity:1} 25%{transform:translate(-50%,-80%) scale(1.15)} 70%{transform:translate(-50%,-125%) scale(1.15); opacity:1} 100%{transform:translate(-50%,-170%) scale(.95); opacity:0} }
  nav { flex:none; padding:6px 8px calc(8px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:linear-gradient(#0d0a07,#17110b); }
  nav button { appearance:none; border:1px solid #6b5326; background:linear-gradient(#3a2c1a,#241a10); color:#f1dfae; font:700 12px Georgia,serif; letter-spacing:.04em; padding:9px 4px; border-radius:8px; }
  nav button small { display:block; font-weight:400; font-size:9.5px; color:#b9a77d; margin-top:1px; letter-spacing:0; }
  nav button:active { background:#4b381f; }
  nav button.on { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  #opts { grid-column:1/-1; display:flex; gap:8px; justify-content:center; font-size:11px; color:#c9b88f; }
  #opts label { display:flex; align-items:center; gap:5px; }
  .tag { position:absolute; transform:translate(-50%,-50%); font:900 17px/1 Georgia,serif; letter-spacing:.02em; pointer-events:none; white-space:nowrap; text-shadow:0 2px 0 rgba(40,20,0,.9), 0 0 6px rgba(0,0,0,.9), 1px 1px 0 #000, -1px -1px 0 #000; animation: tagup 1.7s ease-out forwards; z-index:20; }
  @keyframes tagup { 0%{opacity:0; transform:translate(-50%,-30%) scale(.6)} 14%{opacity:1; transform:translate(-50%,-60%) scale(1.15)} 28%{transform:translate(-50%,-70%) scale(1)} 78%{opacity:1; transform:translate(-50%,-120%)} 100%{opacity:0; transform:translate(-50%,-150%)} }
  .cb { position:absolute; width:44px; height:62px; transform:translate(-50%,-50%); border-radius:5px; border:2px solid #d9b45a; background:radial-gradient(circle at 50% 45%, #6b2a2a 0 28%, #3a1a1a 29% 60%, #241010 61%); box-shadow:0 3px 8px rgba(0,0,0,.7); z-index:7; }
  .cb::after { content:''; position:absolute; inset:7px; border:1px solid rgba(217,180,90,.6); border-radius:3px; }
  #gold { position:absolute; left:8px; top:300px; width:52px; height:44px; display:flex; align-items:center; justify-content:center; gap:4px; border-radius:22px; background:linear-gradient(#3a2a14,#1c140a); border:2px solid #d9b45a; box-shadow:0 3px 8px rgba(0,0,0,.7); z-index:15; font:900 18px Georgia,serif; color:#ffe9a8; }
  #gold i { width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1a8, #d89a1c 60%, #8a5a08); box-shadow:0 0 0 1px #6b4608; }
  #gold.pop { animation: gpop .45s ease-out; } @keyframes gpop { 0%{transform:scale(1)} 30%{transform:scale(1.28); filter:brightness(1.5)} 100%{transform:scale(1)} }
  .tabs { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .tabs button { font-size:13px; padding:8px 4px; } .grp { display:none; grid-column:1/-1; grid-template-columns:repeat(2,1fr); gap:6px; } .grp.on { display:grid; }
  nav { grid-template-columns:1fr; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Efeitos do Cardeal</h1>
    <p id="cap">Cardeal (embaixo) contra Capitão (em cima). Toque num botão para ver o efeito. (Mockup: ainda não está no jogo.)</p>
  </header>
  <div id="holder">
    <div id="stage">
      <img id="bg" src="../projeteis/board-battlefield.webp" alt="">
      <div id="cards"></div>
      <canvas id="fx"></canvas>
      <div id="nums"></div>
      <div id="gold"><i></i><span id="goldn">7</span></div>
    </div>
  </div>
  <nav>
    <div class="grp on" id="g-c" style="display:grid">
      <button data-a="bencao">Cardeal Pedro<small>Comando: pilar de luz, +1 HP</small></button>
      <button data-a="calice">Cálice da Graça<small>relíquia: bênção em dose dupla</small></button>
      <button data-a="hospitalario">Cavaleiro Hospitalário<small>cura e cometa sagrado</small></button>
      <button data-a="nobre">Nobre da Cruzada<small>Convocação: sigilos e soldados</small></button>
      <button data-a="soldados">Soldados da Ordem<small>Reforço: desce com Escudo 2</small></button>
      <button data-a="comandante">Comandante da Ordem<small>Postura: trompa e +1/+1</small></button>
      <button data-a="retorno">Retorno do Soldado<small>a alma volta à mão</small></button>
      <button data-a="atirador">Atirador da Cruzada<small>Queda: penas e +2 cartas</small></button>
    </div>
    <div id="opts">
      <label><input type="checkbox" id="art" checked> arte pintada</label>
      <label><input type="checkbox" id="slow"> câmera lenta (¼)</label>
      <label><input type="checkbox" id="snd" checked> som</label>
    </div>
  </nav>
</div>
<script>
'use strict';
const W = 390, H = 640;
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const COLX = [55, 125, 195, 265, 335];
const ROW = { eGen: 50, eBack: 142, eFront: 234, pFront: 410, pBack: 502, pGen: 592 };
const CAPD = '../quarto/cards/', MERC = 'cards/';
const CARDS = [
  [CAPD + 'comandante-aurelion-mestre-da-formacao', 195, ROW.eGen, 'big'],
  [CAPD + 'cavaleiro-tatico', COLX[1], ROW.eBack], [CAPD + 'capitao-de-formacao', COLX[2], ROW.eBack],
  [CAPD + 'escudeiro-de-linha', COLX[0], ROW.eFront], [CAPD + 'soldado-tatico', COLX[1], ROW.eFront], [CAPD + 'veterano-de-guerra', COLX[2], ROW.eFront], [CAPD + 'batedor', COLX[3], ROW.eFront], [CAPD + 'lanceiro-de-controle', COLX[4], ROW.eFront],
  [CAPD + 'devotos-da-cruzada', COLX[0], ROW.pFront], [CAPD + 'cavaleiro-hospitalario', COLX[1], ROW.pFront], [CAPD + 'cavaleiro-da-luz', COLX[2], ROW.pFront], [CAPD + 'comandante-da-ordem', COLX[3], ROW.pFront], [CAPD + 'recruta-devoto', COLX[4], ROW.pFront],
  [CAPD + 'soldados-da-ordem', COLX[0], ROW.pBack], [CAPD + 'nobre-da-cruzada', COLX[2], ROW.pBack], [CAPD + 'atirador-da-cruzada', COLX[4], ROW.pBack],
  [CAPD + 'cardeal-pedro-voz-da-fe', 195, ROW.pGen, 'big'],
];
const els = []; const cardsEl = $('#cards');
for (const row of [ROW.eBack, ROW.eFront, ROW.pFront, ROW.pBack]) for (const x of COLX) { const s = document.createElement('div'); s.className = 'slot'; s.style.left = x + 'px'; s.style.top = row + 'px'; cardsEl.appendChild(s); }
CARDS.forEach(([n, x, y, cls]) => { const im = document.createElement('img'); im.className = 'card ' + (cls || ''); im.src = n + '.webp'; im.style.left = x + 'px'; im.style.top = y + 'px'; im.draggable = false;
  cardsEl.appendChild(im); els.push(im); im.dataset.x = x; im.dataset.y = y; });
const enemyCards = els.filter(e => +e.dataset.y <= ROW.eFront);
const cardByPos = (x, y) => els.find(e => +e.dataset.x === x && +e.dataset.y === y);

// ── scale the stage to the screen ────────────────────────────────────────────────────────────────────────────────
const stage = $('#stage'), cv = $('#fx'), ctx = cv.getContext('2d');
let RES = 2;
function fit() {
  const h = $('#holder').getBoundingClientRect();
  const k = Math.min(h.width / W, h.height / H);
  stage.style.transform = `scale(${k})`;
  RES = Math.min(3, (window.devicePixelRatio || 1) * k);
  cv.width = Math.round(W * RES); cv.height = Math.round(H * RES);
}
addEventListener('resize', fit); fit();

// ── assets ────────────────────────────────────────────────────────────────────────────────────────────────────────
const IMG = {};
const PJ = '../projeteis/';
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = () => { console.warn('falta', src); r(); }; i.src = src; });
const ready = Promise.all([load('fire', PJ + 'fx-boom-fire.webp'), load('smoke', PJ + 'fx-boom-smoke.webp'), load('holy', PJ + 'fx-holy.webp'), load('puff', PJ + 'fx-puff.webp'), load('debris', PJ + 'fx-debris.webp'),
  load('rock', PJ + 'proj-rock.webp'), load('bolt', PJ + 'proj-bolt.webp'), load('arrow', PJ + 'proj-arrow.webp'), load('lance', PJ + 'proj-lance.webp'),
  load('a_lanca', PJ + 'art/lanca.webp'), load('a_virote', PJ + 'art/virote.webp'), load('a_flecha', PJ + 'art/flecha.webp'), load('a_veneno', PJ + 'art/flecha-veneno.webp'),
  load('a_pedra', PJ + 'art/pedra.webp'), load('a_brasa', PJ + 'art/pedra-brasa.webp'), load('a_espada', PJ + 'art/espada-aurelion.webp'), load('a_martelo', PJ + 'art/martelo.webp'),
  load('coin', '../efeitos-decks/fx-coin.webp'), load('seal', '../efeitos-decks/fx-seal.webp'), load('contrato', '../efeitos-decks/fx-contrato.webp'), load('stars', '../efeitos-decks/fx-stars.webp'), load('swamp', '../efeitos-decks/fx-pantano.webp'), load('cracks', '../efeitos-decks/fx-cracks.webp'), load('gold', '../efeitos-decks/fx-gold.webp'),
  load('shield_appear', '../efeitos-decks/fx-shield-appear.webp'), load('shield_loop', '../efeitos-decks/fx-shield-loop.webp'), load('shield_break', '../efeitos-decks/fx-shield-break.webp'), load('bandeira_a', '../efeitos-decks/fx-bandeira-a.webp'), load('bandeira_b', '../efeitos-decks/fx-bandeira-b.webp'), load('plantar_a', '../efeitos-decks/fx-bandeira-plantar-a.webp'), load('plantar_b', '../efeitos-decks/fx-bandeira-plantar-b.webp'), load('cair_a', '../efeitos-decks/fx-bandeira-cair-a.webp'), load('cair_b', '../efeitos-decks/fx-bandeira-cair-b.webp'),
  load('pilar', 'fx-pilar.webp'), load('sigilo', 'fx-sigilo.webp'), load('sigilo_azul', 'fx-sigilo-azul.webp'), load('cruz', 'fx-cruz.webp'), load('escudo', 'fx-escudo.webp'), load('alma', 'fx-alma.webp'), load('penas', 'fx-penas.webp'), load('trompa', 'fx-trompa.webp'), load('brilhos', 'fx-brilhos.webp'), load('coracao', 'fx-coracao.webp'), load('cometa', 'fx-cometa.webp'), load('asas', 'fx-asas.webp'), load('sol', 'fx-sol.webp'), load('portal', 'fx-portal.webp'),
  load('dagger', '../efeitos-decks/proj-dagger.webp'), load('purse', '../efeitos-decks/proj-purse.webp'), load('ball', '../efeitos-decks/proj-ball.webp')]);
// painted art (the images the owner made) or the sprites drawn by code, switched by the checkbox
const painted = () => $('#art').checked;
function pick(k) {
  const M = { lanca: ['a_lanca', 'lance'], virote: ['a_virote', 'bolt'], flecha: ['a_flecha', 'arrow'], veneno: ['a_veneno', 'arrow'], pedra: ['a_pedra', 'rock'], brasa: ['a_brasa', 'rock'], espada: ['a_espada', 'lance'], martelo: ['a_martelo', 'lance'] };
  const [pa, pr] = M[k], useP = painted() && IMG[pa], img = useP ? IMG[pa] : IMG[pr];
  return { img, size: img === IMG.rock ? [128, 128] : [img.naturalWidth, img.naturalHeight], frame: img === IMG.rock && k === 'brasa' ? 1 : 0, painted: !!useP };
}

// ── sound (the game's own sounds + a synthesized whoosh) ───────────────────────────────────────────────────────────
let AC = null; const BUF = {};
function audio() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); ['boom', 'hit', 'dano', 'magic'].forEach(n => fetch(PJ + n + (n === 'magic' ? '.mp3' : '.wav')).then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(d => BUF[n] = d).catch(() => {})); } if (AC.state === 'suspended') AC.resume(); return AC; }
const sndOn = () => $('#snd').checked && AC && speed === 1;
function play(name, when, vol = 1, rate = 1, offset = 0) {
  if (!sndOn() || !BUF[name]) return;
  const s = AC.createBufferSource(); s.buffer = BUF[name]; s.playbackRate.value = rate; const g = AC.createGain(); g.gain.value = vol; s.connect(g).connect(AC.destination);
  s.start(AC.currentTime + Math.max(0, when), Math.max(0, offset));
}
function whoosh(when, dur, vol = .5, f0 = 400, f1 = 1800) {
  if (!sndOn()) return;
  const n = Math.ceil(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  const t = AC.currentTime + when; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .55); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}

// ── tiny simulation: timeline of things that draw themselves ────────────────────────────────────────────────────────
let now = 0, speed = 1; const fxs = []; const sched = [];
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const eo = u => 1 - Math.pow(1 - clamp(u), 3), ei = u => clamp(u) * clamp(u);
const at = (delay, fn) => sched.push({ t: now + delay, fn });
const add = (o) => { o.t0 = o.t0 ?? now; fxs.push(o); return o; };

function sprite(img, cols, size, frame, x, y, sc, alpha, mode, ax = .5, ay = .5, flip = 1) {
  const c = frame % cols, r = Math.floor(frame / cols);
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = mode || 'source-over';
  ctx.translate(x, y); ctx.scale(sc * flip, sc);
  ctx.drawImage(img, c * size, r * size, size, size, -size * ax, -size * ay, size, size);
  ctx.restore();
}

// ── effects ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// the fireball: smoke under (normal), fire over (additive). Frame centre of the blast is at (50%, 60%) of the frame.
const FS = .72;   // the blasts are drawn smaller than the sprite sheet
function explosion(x, y, sc = 1, delay = 0, flip = 1) {
  sc *= FS; const dur = 1.25, f = flip < 0 ? -1 : 1;
  at(delay, () => add({ dur, draw(p) {
    const fr = Math.min(29, Math.floor(p * 30));
    sprite(IMG.smoke, 6, 256, fr, x, y, sc, 1, 'source-over', .5, .6, f);
    sprite(IMG.fire, 6, 256, fr, x, y, sc, 1, 'lighter', .5, .6, f);
  } }));
}
function holy(x, y, sc = 1, delay = 0) {
  at(delay, () => add({ dur: 1.0, draw(p) { sprite(IMG.holy, 6, 256, Math.min(23, Math.floor(p * 24)), x, y, sc, 1, 'lighter'); } }));
}
function flash(x, y, r, color = '255,190,90', a = .55, dur = .28) {
  add({ dur, draw(p) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); const al = a * (1 - p) * (1 - p);
    g.addColorStop(0, `rgba(${color},${al})`); g.addColorStop(1, `rgba(${color},0)`); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); } });
}
function shock(x, y, r, dur = .55, color = '255,226,170', w = 5) {
  add({ dur, draw(p) { const e = eo(p), rx = r * e, al = (1 - p) * (1 - p) * .6;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${color},${al})`; ctx.lineWidth = w * (1 - p) * .7 + .8;
    ctx.beginPath(); ctx.ellipse(x, y, rx, rx * .42, 0, 0, Math.PI * 2); ctx.stroke();
    const g = ctx.createRadialGradient(x, y, rx * .5, x, y, rx); g.addColorStop(0, 'rgba(255,200,120,0)'); g.addColorStop(1, `rgba(255,200,120,${al * .18})`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rx, rx * .42, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); } });
}
function scorch(x, y, rx, dur = 2.6) {
  add({ dur, draw(p) { const al = .5 * Math.min(1, p * 8) * (1 - p); const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
    g.addColorStop(0, `rgba(10,6,3,${al})`); g.addColorStop(1, 'rgba(10,6,3,0)'); ctx.save(); ctx.translate(x, y); ctx.scale(1, .45); ctx.translate(-x, -y); ctx.fillStyle = g; ctx.fillRect(x - rx, y - rx, rx * 2, rx * 2); ctx.restore(); } });
}
function puff(x, y, vx, vy, size, life, a = .6, grow = 2.2, tint = 0) {
  const k = Math.floor(Math.random() * 4), rot = R(0, 6.28), vr = R(-1, 1);
  add({ dur: life, draw(p) { const px = x + vx * p * life, py = y + vy * p * life; const s = size * (1 + grow * eo(p)) / 128;
    ctx.save(); ctx.globalAlpha = a * (1 - p) * Math.min(1, p * 10); ctx.translate(px, py); ctx.rotate(rot + vr * p);
    ctx.drawImage(IMG.puff, k * 128, 0, 128, 128, -64 * s, -64 * s, 128 * s, 128 * s); ctx.restore(); } });

function ding(when = 0, vol = .22, f = 1760) {

  [[1, 1], [2.76, .45], [5.4, .22]].forEach(([m, a]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * a, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + .55); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .6); });
}
function clink(when = 0, vol = .18) { ding(when, vol, 2400 + R(0, 700)); }
const COIN_FR = 16;
function coinAt(x, y, size, t, alpha = 1, rot = 0, speedK = 18) {
  const fr = Math.floor(t * speedK) % COIN_FR, c = fr % 8, r = Math.floor(fr / 8);
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4;
  ctx.drawImage(IMG.coin, c * 96, r * 96, 96, 96, -size / 2, -size / 2, size, size); ctx.restore();
}
function coinFly({ from, to, dur = .5, delay = 0, arc = 50, size = 22, onEnd, ph = R(0, 1) }) {
  at(delay, () => add({ dur, draw(p) {
    const u = p * p * (3 - 2 * p) * .35 + p * .65, x = from.x + (to.x - from.x) * u, y = from.y + (to.y - from.y) * u - arc * 4 * u * (1 - u);
    if (Math.random() < .7) add({ dur: .3, draw(q) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,224,130,${.8 * (1 - q)})`; ctx.beginPath(); ctx.arc(x + R(-3, 3), y + R(-3, 3), 2.2 * (1 - q) + .4, 0, 7); ctx.fill(); ctx.restore(); } });

}

    add({ dur: life, draw(p) { const t = p * life; let py = y + vy * t + .5 * g * t * t, px = x + vx * t, onG = false;
      if (py > y + ground) { py = y + ground - Math.abs(Math.sin((t - .55) * 8)) * 3 * Math.exp(-(t - .55) * 4); onG = true; px = x + vx * .55 + vx * (t - .55) * .12; }

  } });
}

  cardsEl.style.transform = ''; cv.style.transform = ''; if (tacEl) { tacEl.remove(); tacEl = null; }
}
function runScene(k) {
  audio();
  document.querySelectorAll('nav button[data-a]').forEach(b => b.classList.toggle('on', b.dataset.a === k));
  fxs.length = 0; sched.length = 0; now = 0; $('#nums').innerHTML = ''; resetBoard(); setGold(7);
  current = k; $('#cap').textContent = scenes[k].cap;
  speed = $('#slow').checked ? .25 : 1;
  scenes[k].run();
}
document.querySelectorAll('nav button[data-a]').forEach(b => b.onclick = () => runScene(b.dataset.a));


// ── main loop (`?manual` lets a test advance time by hand with window.__step(seconds)) ───────────────────────────────
function tick(dt) {
  now += dt * speed;
  for (let i = sched.length - 1; i >= 0; i--) if (sched[i].t <= now) { const s = sched.splice(i, 1)[0]; s.fn(); }
  ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < fxs.length; i++) {
    const f = fxs[i], p = (now - f.t0) / f.dur;
    if (p >= 1) { f.end && f.end(); fxs.splice(i, 1); i--; continue; }
    if (p >= 0) f.draw(p);
  }
}
let lastT = performance.now();
if (!q.has('manual')) (function loop(t) { tick(Math.min(.05, (t - lastT) / 1000)); lastT = t; requestAnimationFrame(loop); })(lastT);
window.__step = (s) => { speed = 1; const n = Math.round(s / (1 / 60)); for (let i = 0; i < n; i++) tick(1 / 60); };
window.__run = (k) => { runScene(k); speed = 1; };
ready.then(() => { if (q.get('run')) runScene(q.get('run')); });
</script>
