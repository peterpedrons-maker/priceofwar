<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desafios: escolha do adversário (mockup)</title>
<style>
  :root { --gold:#e6c36a; --gold2:#f6e3a3; --ink:#120d08; --panel:rgba(18,12,8,.72); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; background:#050403; color:#f3e8cc; font-family:'Cinzel',Georgia,'Times New Roman',serif; overflow:hidden; }
  #app { position:relative; width:100%; max-width:430px; height:100dvh; margin:0 auto; overflow:hidden; background:#0a0705; }
  /* fundo por adversário (duas camadas para cruzar suavemente) */
  .bg { position:absolute; inset:-6%; opacity:0; transition:opacity .7s ease; background-size:cover; background-position:center; }
  .bg.on { opacity:1; }
  .bg::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.85) 100%); }
  .bg .art { position:absolute; inset:0; background-size:cover; background-position:50% 20%; filter:blur(10px) brightness(.55) saturate(1.2); transform:scale(1.25); }
  .bg .tint { position:absolute; inset:0; mix-blend-mode:soft-light; }
  .bg .motif { position:absolute; inset:0; opacity:.5; mix-blend-mode:screen; }
  /* topo */
  header { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 12px) 14px 8px; display:flex; align-items:center; gap:10px; z-index:5; }
  .back { width:38px; height:38px; border-radius:50%; border:1px solid rgba(230,195,106,.55); background:var(--panel); color:var(--gold); font-size:20px; display:flex; align-items:center; justify-content:center; }
  h1 { margin:0; font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold2); text-shadow:0 2px 0 #000, 0 0 14px rgba(230,195,106,.35); flex:1; }
  .deckchip { display:flex; align-items:center; gap:7px; padding:6px 11px; border-radius:20px; border:1px solid rgba(230,195,106,.55); background:var(--panel); font-size:12px; color:var(--gold2); letter-spacing:.05em; }
  .deckchip small { display:block; font-size:9px; opacity:.7; letter-spacing:.14em; text-transform:uppercase; }
  .deckchip i { width:26px; height:26px; border-radius:6px; background-size:cover; background-position:center top; border:1px solid var(--gold); }
  .seg { position:absolute; top:calc(env(safe-area-inset-top) + 62px); left:50%; transform:translateX(-50%); z-index:5; display:flex; border:1px solid rgba(230,195,106,.5); border-radius:18px; overflow:hidden; background:var(--panel); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .seg button { all:unset; padding:6px 16px; color:#bda76d; cursor:pointer; }
  .seg button.on { background:linear-gradient(#f0d68a,#b88b2c); color:#2a1a05; font-weight:700; }
  /* a roda */
  #wheelView { position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 104px); height:420px; perspective:1000px; touch-action:pan-y; cursor:grab; }
  #wheelView:active { cursor:grabbing; }
  .ring { position:absolute; left:50%; top:200px; width:0; height:0; transform-style:preserve-3d; }
  .item { position:absolute; width:190px; height:270px; margin:-135px 0 0 -95px; border-radius:10px; transition:filter .3s; will-change:transform,opacity; }
  .item img { width:100%; height:100%; border-radius:10px; display:block; pointer-events:none; box-shadow:0 14px 28px rgba(0,0,0,.7); }
  .item.sel img { box-shadow:0 0 0 2px rgba(240,214,138,.9), 0 0 26px rgba(240,200,100,.55), 0 16px 32px rgba(0,0,0,.75); }
  .item.locked img { filter:grayscale(1) brightness(.35); }
  .lock { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:12px; letter-spacing:.14em; color:#cdbb86; text-transform:uppercase; pointer-events:none; text-shadow:0 2px 4px #000; }
  .lock b { font-size:34px; }
  .floor { position:absolute; left:50%; top:340px; width:340px; height:70px; margin-left:-170px; background:radial-gradient(ellipse, rgba(240,200,100,.45), rgba(240,200,100,0) 70%); pointer-events:none; }
  .arrow { position:absolute; top:178px; width:44px; height:44px; border-radius:50%; border:1px solid rgba(230,195,106,.7); background:var(--panel); color:var(--gold2); font-size:22px; display:flex; align-items:center; justify-content:center; z-index:4; }
  .arrow.l { left:8px; } .arrow.r { right:8px; }
  .dots { position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 104px + 424px); display:flex; justify-content:center; gap:7px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:rgba(230,195,106,.3); transition:all .25s; } .dots i.on { background:var(--gold2); width:20px; border-radius:4px; }
  /* lista (alternativa) */
  #listView { position:absolute; left:12px; right:12px; top:calc(env(safe-area-inset-top) + 100px); height:330px; overflow:auto; display:none; }
  .row { display:flex; gap:12px; align-items:center; padding:8px; margin-bottom:8px; border-radius:12px; border:1px solid rgba(230,195,106,.25); background:var(--panel); }
  .row.sel { border-color:var(--gold2); box-shadow:0 0 18px rgba(240,200,100,.35); }
  .row img { width:52px; height:74px; border-radius:6px; object-fit:cover; } .row.locked img { filter:grayscale(1) brightness(.4); }
  .row h3 { margin:0; font-size:14px; color:var(--gold2); } .row p { margin:2px 0 0; font-size:11px; color:#c9b88e; font-family:Georgia,serif; }
  /* painel de informação */
  .info { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 92px); padding:12px 14px 12px; border-radius:14px; border:1px solid rgba(230,195,106,.5); background:linear-gradient(rgba(30,20,10,.82),rgba(14,9,5,.9)); box-shadow:0 8px 24px rgba(0,0,0,.6); }
  .info .top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .info h2 { margin:0; font-size:19px; color:var(--gold2); letter-spacing:.06em; }
  .info .gen { font-size:11px; color:#c9b88e; letter-spacing:.1em; text-transform:uppercase; }
  .info p { margin:6px 0 8px; font-size:13px; line-height:1.35; color:#e7dcc0; font-family:Georgia,serif; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:11px; padding:3px 9px; border-radius:11px; background:rgba(230,195,106,.14); border:1px solid rgba(230,195,106,.35); color:#f0dca0; letter-spacing:.04em; }
  .stars { margin-left:auto; font-size:20px; letter-spacing:3px; color:var(--gold); text-shadow:0 0 8px rgba(240,200,100,.6); } .stars .off { color:rgba(230,195,106,.25); text-shadow:none; }
  .fight { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 18px); height:60px; border-radius:30px; border:2px solid #fff0b8; background:linear-gradient(#f4d983,#c0902f 55%,#8b5f16); color:#2a1604; font:900 21px/1 'Cinzel',Georgia,serif; letter-spacing:.3em; text-transform:uppercase; text-shadow:0 1px 0 rgba(255,255,255,.5); box-shadow:0 6px 0 #5b3a0a, 0 12px 24px rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; gap:10px; }
  .fight:active { transform:translateY(4px); box-shadow:0 2px 0 #5b3a0a, 0 6px 14px rgba(0,0,0,.6); }
  .fight.off { filter:grayscale(.9) brightness(.55); box-shadow:none; pointer-events:none; letter-spacing:.18em; font-size:16px; }
  .swapnote { position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 100px + 322px); text-align:center; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(230,195,106,.55); pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
  <header>
    <div class="back">‹</div><h1>Desafios</h1>
    <div class="deckchip" id="deckchip"><i id="deckthumb"></i><span><small>Seu deck</small><b id="deckname">Deck 1</b></span><span>▾</span></div>
  </header>
  <div class="seg"><button class="on" data-v="wheel">Roda</button><button data-v="list">Lista</button></div>
  <div id="wheelView"><div class="floor"></div><div class="ring" id="ring"></div>
    <div class="arrow l" id="prev">‹</div><div class="arrow r" id="next">›</div></div>
  <div class="dots" id="dots"></div>
  <div id="listView"></div>
  <div class="info" id="info"></div>
  <button class="fight" id="fight">Lutar</button>
</div>
<script>
'use strict';
const Q = '../quarto/cards/', E = '../efeitos-decks/cards/';
const OPP = [
  { id:'capitao', name:'Deck Capitão', gen:'Comandante Aurelion', sub:'Mestre da Formação', img:Q+'comandante-aurelion-mestre-da-formacao.webp', desc:'Movimento e formação: cada manobra dá bônus aos vizinhos. Joga rápido e bate forte.', tips:'Cuidado com combinações de movimento.', diff:3, stars:2, reward:'Booster de Capitão',
    tint:'rgba(200,60,40,.65)', grad:'radial-gradient(circle at 20% 80%, rgba(210,70,40,.55), transparent 55%), radial-gradient(circle at 80% 20%, rgba(90,110,150,.5), transparent 55%)' },
  { id:'cardeal', name:'Deck Cardeal', gen:'Cardeal Pedro', sub:'Voz da Fé', img:Q+'cardeal-pedro-voz-da-fe.webp', desc:'Fé e ferro: cura, convocações e emboscadas sagradas. Aguenta e vira o jogo.', tips:'Dano em área quebra as convocações.', diff:2, stars:3, reward:'Booster de Cardeal',
    tint:'rgba(240,200,90,.6)', grad:'radial-gradient(circle at 50% 10%, rgba(255,235,160,.6), transparent 55%), radial-gradient(circle at 15% 85%, rgba(240,200,110,.35), transparent 55%)' },
  { id:'mercenarios', name:'Deck Mercenários', gen:'Brann Meia-Coroa', sub:'Comprador de Guerras', img:E+'brann-meia-coroa-comprador-de-guerras.webp', desc:'Ouro e manutenção: tropas alugadas com ataque alto. Paga caro e bate duro.', tips:'Quem não paga, perde a tropa.', diff:3, stars:1, reward:'Booster de Mercenários',
    tint:'rgba(120,150,60,.6)', grad:'radial-gradient(circle at 80% 85%, rgba(150,170,70,.5), transparent 55%), radial-gradient(circle at 20% 20%, rgba(190,140,50,.45), transparent 55%)' },
  { id:'bardos', name:'Deck Bardos', gen:'Aldric Língua-de-Prata', sub:'Menestrel do Rei', img:Q+'cardeal-pedro-voz-da-fe.webp', locked:true, desc:'Em breve: cantores que se dão bônus entre si; em grupo ficam difíceis de abater.', tips:'', diff:0, stars:0, reward:'', tint:'rgba(150,80,170,.55)', grad:'radial-gradient(circle at 50% 30%, rgba(170,90,190,.5), transparent 60%)' },
  { id:'muralha', name:'Guarda da Muralha', gen:'Capitão da Torre', sub:'Defensor do Castelo', img:Q+'comandante-aurelion-mestre-da-formacao.webp', locked:true, desc:'Em breve: fortificações, escudos e trabucos. Vence pelo desgaste.', tips:'', diff:0, stars:0, reward:'', tint:'rgba(100,120,150,.55)', grad:'radial-gradient(circle at 50% 80%, rgba(110,130,160,.5), transparent 60%)' },
];
const MY = [{ n:'Deck 1', d:'Capitão', img:Q+'comandante-aurelion-mestre-da-formacao.webp' }, { n:'Deck 2', d:'Cardeal', img:Q+'cardeal-pedro-voz-da-fe.webp' }, { n:'Deck 3', d:'Mercenários', img:E+'brann-meia-coroa-comprador-de-guerras.webp' }];
const N = OPP.length, $ = s => document.querySelector(s);
let pos = 1, target = 1, vel = 0, dragging = false, cur = -1, bgSwap = 0, myDeck = 0, view = 'wheel';
const ring = $('#ring');
OPP.forEach((o, i) => { const d = document.createElement('div'); d.className = 'item' + (o.locked ? ' locked' : ''); d.dataset.i = i; d.innerHTML = `<img src="${o.img}" alt="">` + (o.locked ? '<div class="lock"><b>🔒</b>em breve</div>' : ''); ring.appendChild(d); });
const items = [...ring.children];
$('#dots').innerHTML = OPP.map(() => '<i></i>').join('');
// lista
$('#listView').innerHTML = OPP.map((o, i) => `<div class="row${o.locked ? ' locked' : ''}" data-i="${i}"><img src="${o.img}"><div><h3>${o.name}</h3><p>${o.gen}</p></div><span class="stars" style="font-size:14px">${o.locked ? '🔒' : '★'.repeat(o.stars) + '<span class="off">' + '★'.repeat(3 - o.stars) + '</span>'}</span></div>`).join('');
document.querySelectorAll('.row').forEach(r => r.onclick = () => { go(+r.dataset.i); });
const wrap = (d) => ((d + N / 2) % N + N) % N - N / 2;
function layout() {
  items.forEach((el, i) => {
    const d = wrap(i - pos), a = Math.abs(d), th = d * .92, R = 215;
    const x = Math.sin(th) * R, z = (Math.cos(th) - 1) * R * 1.15, ry = -th * 52, sc = 1 + (a < 1 ? (1 - a) * .22 : 0) - Math.min(a, 2) * .1;
    el.style.transform = `translate3d(${x}px, ${a * 6}px, ${z}px) rotateY(${ry}deg) scale(${sc})`;
    el.style.opacity = a > 2.3 ? 0 : 1 - Math.max(0, a - 1) * .45;
    el.style.zIndex = 100 - Math.round(a * 10);
    el.style.filter = `brightness(${1 - Math.min(a, 1.6) * .38})`;
    el.classList.toggle('sel', a < .5);
  });
  const k = ((Math.round(pos) % N) + N) % N;
  if (k !== cur) { cur = k; select(k); }
}
function select(k) {
  const o = OPP[k];
  // fundo: a camada que não está visível recebe a nova arte
  const nxt = bgSwap ? $('#bgA') : $('#bgB'), old = bgSwap ? $('#bgB') : $('#bgA'); bgSwap ^= 1;
  nxt.innerHTML = `<div class="art" style="background-image:url('${o.img}')"></div><div class="tint" style="background:${o.tint}"></div><div class="motif" style="background:${o.grad}"></div>`;
  nxt.classList.add('on'); old.classList.remove('on');
  document.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i === k));
  document.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('sel', i === k));
  const stars = o.locked ? '' : '★'.repeat(o.stars) + '<span class="off">' + '★'.repeat(3 - o.stars) + '</span>';
  $('#info').innerHTML = `<div class="top"><h2>${o.name}</h2><span class="gen">${o.gen}</span></div><p>${o.desc}${o.tips ? ' <i style="opacity:.75">Dica: ' + o.tips + '</i>' : ''}</p>` +
    (o.locked ? '<div class="chips"><span class="chip">🔒 Ainda não disponível</span></div>' : `<div class="chips"><span class="chip">Dificuldade ${'●'.repeat(o.diff)}${'○'.repeat(3 - o.diff)}</span><span class="chip">🎁 1ª vitória: ${o.reward}</span><span class="stars">${stars}</span></div>`);
  const f = $('#fight'); f.classList.toggle('off', !!o.locked); f.textContent = o.locked ? 'Em breve' : 'Lutar';
}
function go(i) { const base = Math.round(pos); target = base + wrap(i - base); }
function tick() {
  if (!dragging) { const diff = target - pos; vel += diff * .12; vel *= .74; pos += vel; if (Math.abs(diff) < .001 && Math.abs(vel) < .001) { pos = target; } }
  layout(); requestAnimationFrame(tick);
}
const wv = $('#wheelView'); let sx = 0, sp = 0, moved = 0, lastX = 0, lastT = 0, v0 = 0;
wv.addEventListener('pointerdown', e => { dragging = true; sx = lastX = e.clientX; sp = pos; moved = 0; lastT = performance.now(); v0 = 0; wv.setPointerCapture(e.pointerId); });
wv.addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx)); pos = sp - dx / 105; const t = performance.now(); v0 = (lastX - e.clientX) / 105 / Math.max(1, t - lastT) * 16; lastX = e.clientX; lastT = t; });
wv.addEventListener('pointerup', e => { if (!dragging) return; dragging = false;
  if (moved < 6) { const it = document.elementFromPoint(e.clientX, e.clientY)?.closest('.item'); if (it) { go(+it.dataset.i); return; } }
  target = Math.round(pos + v0 * 5); vel = 0; });
$('#prev').onclick = e => { e.stopPropagation(); target = Math.round(pos) - 1; }; $('#next').onclick = e => { e.stopPropagation(); target = Math.round(pos) + 1; };
['#prev', '#next'].forEach(s => $(s).addEventListener('pointerdown', e => e.stopPropagation()));
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') target = Math.round(pos) - 1; if (e.key === 'ArrowRight') target = Math.round(pos) + 1; });
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { view = b.dataset.v; document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); $('#wheelView').style.display = view === 'wheel' ? '' : 'none'; $('.dots').style.display = view === 'wheel' ? '' : 'none'; $('#listView').style.display = view === 'list' ? 'block' : 'none'; });
function deck() { const m = MY[myDeck]; $('#deckname').textContent = m.n + ' · ' + m.d; $('#deckthumb').style.backgroundImage = `url('${m.img}')`; }
$('#deckchip').onclick = () => { myDeck = (myDeck + 1) % MY.length; deck(); };
$('#fight').onclick = () => { const o = OPP[cur]; if (!o.locked) { const b = $('#fight'); b.textContent = 'Preparando…'; setTimeout(() => { b.textContent = 'Lutar'; }, 1100); } };
deck(); tick();
window.__go = i => go(i); window.__next = () => { target = Math.round(pos) + 1; }; window.__drag = (dx) => { target = Math.round(pos - dx / 105); };
</script>
</body>
</html>
