<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desafios: lista de adversários sobre o mapa (mockup)</title>
<style>
  :root { --gold:#e6c36a; --gold2:#f6e3a3; --ivory:#f3e8cc; --ink:#120d08; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; background:#050403; color:var(--ivory); font-family:'Cinzel',Georgia,'Times New Roman',serif; overflow:hidden; }
  #app { position:relative; width:100%; max-width:430px; height:100dvh; margin:0 auto; overflow:hidden; background:#0a0705; display:flex; flex-direction:column; }
  /* ── mapa: a câmera desliza até a região do adversário ── */
  #stage { position:relative; flex:1 1 auto; min-height:260px; overflow:hidden; }
  #fx { position:absolute; inset:0; transform-origin:195px 215px; }
  #map { position:absolute; left:0; top:0; width:1150px; height:1150px; transform-origin:0 0; background:url(map.webp) 0 0/100% 100% no-repeat; transition:transform 1.4s cubic-bezier(.45,.05,.2,1); will-change:transform; filter:saturate(.9) brightness(.9); }
  #map .mk { position:absolute; width:0; height:0; opacity:0; transition:opacity .6s; cursor:pointer; }
  #map.over .mk { opacity:1; }
  #map .mk svg { position:absolute; left:-17px; top:-52px; width:34px; height:52px; transform-origin:17px 52px; transform:scale(var(--inv,1)); filter:drop-shadow(0 3px 5px rgba(0,0,0,.85)); }
  #map .mk.lock svg { filter:grayscale(1) brightness(.7) drop-shadow(0 3px 5px rgba(0,0,0,.85)); }
  #map .mk::after { content:''; position:absolute; left:-30px; top:-30px; width:60px; height:60px; transform:scale(var(--inv,1)); transform-origin:30px 30px; }
  #fx.hop { animation:hop 1.25s cubic-bezier(.45,.05,.2,1); }
  @keyframes hop { 0%{transform:scale(1)} 38%{transform:scale(.78)} 100%{transform:scale(1)} }
  #shade { position:absolute; inset:0; pointer-events:none; background:
      linear-gradient(rgba(5,3,2,.88), rgba(5,3,2,0) 26%),
      linear-gradient(rgba(5,3,2,0) 52%, rgba(5,3,2,.92) 100%),
      radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%); }
  #tint { position:absolute; inset:0; pointer-events:none; mix-blend-mode:soft-light; transition:background .8s; }
  /* pino (fixo na tela; o mapa se move por baixo) */
  #pin { position:absolute; left:195px; top:215px; width:0; height:0; pointer-events:none; transition:opacity .5s; }
  #pin.hide, #place.hide { opacity:0; }
  #pin svg { position:absolute; left:-17px; top:-50px; width:34px; height:52px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.8)); animation:bob 2.2s ease-in-out infinite; }
  #pin .pulse { position:absolute; left:-26px; top:-8px; width:52px; height:16px; border-radius:50%; border:2px solid rgba(246,227,163,.8); animation:pulse 2s ease-out infinite; }
  #pin .pulse.b { animation-delay:1s; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes pulse { 0%{transform:scale(.3); opacity:.9} 100%{transform:scale(1.7); opacity:0} }
  #pin.locked svg { filter:grayscale(1) brightness(.7) drop-shadow(0 4px 6px rgba(0,0,0,.8)); }
  /* topo */
  header { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 10px) 12px 0; display:flex; align-items:flex-start; justify-content:space-between; z-index:5; pointer-events:none; }
  header > * { pointer-events:auto; }
  .iconbtn { width:46px; height:46px; background:url(ui/icon-btn.png) center/contain no-repeat; display:flex; align-items:center; justify-content:center; color:var(--gold2); font-size:26px; padding-bottom:3px; }
  .iconbtn:active { background-image:url(ui/icon-btn-dark.png); }
  .ribbon { position:absolute; left:50%; top:calc(env(safe-area-inset-top) + 8px); transform:translateX(-50%); width:158px; height:44px; background:url(ui/ribbon.png) center/100% 100% no-repeat; display:flex; align-items:center; justify-content:center; padding-bottom:6px; font-size:13px; letter-spacing:.2em; color:#f6e9c8; text-shadow:0 1px 0 #2a1a08, 0 0 8px rgba(0,0,0,.7); text-transform:uppercase; pointer-events:none; }
  .deckchip { border-style:solid; border-width:10px 28px; border-image:url(ui/btn-secondary.png) 20 56 20 56 fill stretch; height:46px; min-width:98px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:11px; color:var(--gold2); letter-spacing:.04em; line-height:1.05; text-align:center; }
  .deckchip small { display:block; font-size:8px; letter-spacing:.14em; opacity:.7; text-transform:uppercase; }
  .deckchip:active { border-image-source:url(ui/btn-secondary-pressed.png); }
  /* nome da região e texto sobre o mapa */
  #place { transition:opacity .5s; position:absolute; left:0; right:0; top:236px; display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; }
  .plaque { border-style:solid; border-width:12px 34px; border-image:url(ui/chip.png) 22 62 22 62 fill stretch; height:46px; display:flex; align-items:center; font-size:14px; letter-spacing:.12em; color:var(--gold2); white-space:nowrap; text-transform:uppercase; text-shadow:0 1px 2px #000; }
  #place .sub { font-size:10px; letter-spacing:.2em; color:#cdbb86; text-transform:uppercase; text-shadow:0 1px 3px #000; }
  #info { position:absolute; left:18px; right:18px; bottom:10px; text-align:center; z-index:3; }
  #info .div { height:12px; background:url(ui/divider.png) center/contain no-repeat; margin:0 auto 6px; width:80%; opacity:.9; }
  #info p { margin:0 0 7px; font-family:Georgia,serif; font-size:13px; line-height:1.35; color:#eee1bf; text-shadow:0 1px 3px #000, 0 0 8px #000; }
  #info .chips { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
  .chip { border-style:solid; border-width:8px 16px; border-image:url(ui/chip.png) 22 62 22 62 fill stretch; font-size:11px; color:#f0dca0; white-space:nowrap; letter-spacing:.04em; display:flex; align-items:center; height:32px; }
  #hint { position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:#e6d49a; text-shadow:0 1px 4px #000, 0 0 10px #000; transition:opacity .5s; pointer-events:none; }
  #hint.hide { opacity:0; }
  #info .one { font-family:Georgia,serif; font-size:14px; color:#f0e4c4; text-shadow:0 1px 3px #000, 0 0 8px #000; font-style:italic; }
  .drawer { margin:-4px 3px 8px; padding:10px 12px 10px; border:1px solid #6f5324; border-top:none; border-radius:0 0 8px 8px; background:linear-gradient(#1b130b,#120c07); box-shadow:inset 0 6px 8px -6px #000; animation:drawer .35s ease-out; }
  @keyframes drawer { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
  .drawer p { margin:0 0 8px; font-family:Georgia,serif; font-size:13px; line-height:1.35; color:#e9dcba; }
  .drawer .chips { display:flex; gap:7px; flex-wrap:wrap; }
  /* painel de baixo */
  #sheet { position:relative; flex:0 0 auto; padding:14px 12px calc(env(safe-area-inset-bottom) + 14px); background:linear-gradient(#150e08,#0c0804 60%); border-top:2px solid #6f5324; box-shadow:0 -10px 24px rgba(0,0,0,.7), inset 0 1px 0 rgba(246,227,163,.25); z-index:4; }
  #sheet::before { content:''; position:absolute; left:50%; top:-9px; width:150px; height:14px; margin-left:-75px; background:url(ui/divider.png) center/100% 100% no-repeat; }
  #list { max-height:calc(100dvh - 500px); min-height:150px; overflow-y:auto; margin:0 -4px; padding:2px 4px; scrollbar-width:none; }
  #list::-webkit-scrollbar { display:none; }
  .row { position:relative; height:62px; margin-bottom:6px; border-style:solid; border-width:11px 11px 11px 58px; border-image:url(ui/panel-row.png) 22 22 22 112 fill stretch; display:flex; align-items:center; justify-content:space-between; padding:0 0 0 8px; }
  .row.sel { border-image-source:url(ui/row-selected.png); }
  .row.locked { border-image-source:url(ui/row-locked.png); }
  .row .face { position:absolute; left:-52px; top:-5px; width:44px; height:44px; border-radius:5px; background-size:cover; background-position:50% 12%; box-shadow:0 0 0 1px rgba(0,0,0,.8); }
  .row.locked .face { display:none; }
  .row .t { min-width:0; }
  .row h3 { margin:0; font-size:14px; letter-spacing:.05em; color:var(--gold2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 2px #000; }
  .row p { margin:1px 0 0; font-size:10px; letter-spacing:.1em; color:#b9a77a; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.locked h3 { color:#aaa49a; } .row.locked p { color:#8e887c; }
  .stars { display:flex; gap:2px; flex:none; margin-right:2px; } .stars i { width:17px; height:17px; background:url(ui/star-on.png) center/contain no-repeat; } .stars i.off { background-image:url(ui/star-off.png); }
  .row .stars { align-self:center; }
  /* botão Lutar */
  .fight { all:unset; display:flex; align-items:center; justify-content:center; width:100%; height:66px; margin-top:6px; cursor:pointer; border-style:solid; border-width:14px 56px; border-image:url(ui/btn-primary.png) 20 80 20 80 fill stretch; font-weight:900; font-size:22px; letter-spacing:.32em; color:#2a1604; text-shadow:0 1px 0 rgba(255,255,255,.55); text-transform:uppercase; box-sizing:border-box; transition:filter .1s, transform .1s; }
  .fight:active { filter:brightness(.78); transform:translateY(3px); }
  .fight.off { border-image-source:url(ui/btn-primary-off.png); color:#3b3a37; text-shadow:0 1px 0 rgba(255,255,255,.25); font-size:17px; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="fx"><div id="map" class="over"></div></div>
    <div id="tint"></div><div id="shade"></div>
    <div id="pin"><div class="pulse"></div><div class="pulse b"></div>
      <svg viewBox="0 0 34 52"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#e0b04a"/><stop offset="1" stop-color="#8a5f14"/></linearGradient></defs>
        <path d="M17 51 C5 33 1 26 1 17 A16 16 0 0 1 33 17 C33 26 29 33 17 51Z" fill="url(#pg)" stroke="#3a2406" stroke-width="2"/><circle cx="17" cy="17" r="7" fill="#1a0f06" stroke="#3a2406" stroke-width="1.5"/><circle cx="17" cy="17" r="3.2" fill="#ffe9a6"/></svg></div>
    <header><div class="iconbtn">‹</div><div class="ribbon">Desafios</div><div class="deckchip" id="deckchip"><span><small>Seu deck</small><b id="deckname">Capitão</b></span></div></header>
    <div id="place"><div class="plaque" id="region">Marca de Aurelion</div><div class="sub" id="regsub">Capitão</div></div>
    <div id="info"></div><div id="hint">Escolha um adversário</div>
  </div>
  <div id="sheet">
    <div id="list"></div>
    <button class="fight" id="fight">Lutar</button>
  </div>
</div>
<script>
'use strict';
const Q = '../quarto/cards/', E = '../efeitos-decks/cards/';
// ?texto=gaveta (padrão): o mapa fica livre e os detalhes abrem embaixo da linha escolhida · ?texto=curto: uma frase curta sobre o mapa
const MODE = new URLSearchParams(location.search).get('texto') || 'gaveta';
// px,py = posição da cidade no mapa de 1024x1024
const OPP = [
  { id:'capitao', name:'Deck Capitão', gen:'Comandante Aurelion', epi:'Mestre da Formação', region:'Marca de Aurelion', img:'portraits/capitao.webp', px:158, py:488, short:'Movimento e formação', desc:'Movimento e formação: cada manobra dá bônus aos vizinhos. Joga rápido e bate forte.', tip:'Cuidado com combinações de movimento.', diff:3, stars:2, reward:'Booster de Capitão', tint:'rgba(200,70,40,.5)' },
  { id:'cardeal', name:'Deck Cardeal', gen:'Cardeal Pedro', epi:'Voz da Fé', region:'Sé de Pedro', img:'portraits/cardeal.webp', px:676, py:500, short:'Fé, cura e convocações', desc:'Fé e ferro: cura, convocações e emboscadas sagradas. Aguenta e vira o jogo.', tip:'Dano em área quebra as convocações.', diff:2, stars:3, reward:'Booster de Cardeal', tint:'rgba(240,200,90,.55)' },
  { id:'mercenarios', name:'Deck Mercenários', gen:'Brann Meia-Coroa', epi:'Comprador de Guerras', region:'Porto das Meias-Coroas', img:'portraits/mercenarios.webp', px:790, py:745, short:'Ouro e tropas alugadas', desc:'Ouro e manutenção: tropas alugadas com ataque alto. Paga caro e bate duro.', tip:'Quem não paga, perde a tropa.', diff:3, stars:1, reward:'Booster de Mercenários', tint:'rgba(120,150,60,.5)' },
  { id:'bardos', name:'Deck Bardos', gen:'Aldric Língua-de-Prata', epi:'Menestrel do Rei', region:'Vila do Javali Dourado', img:'', px:432, py:705, locked:true, short:'Em breve', desc:'Em breve: cantores que se dão bônus entre si; em grupo ficam difíceis de abater.', tip:'', diff:0, stars:0, reward:'', tint:'rgba(150,80,170,.45)' },
  { id:'muralha', name:'Guarda da Muralha', gen:'Capitão da Torre', epi:'Defensor do Castelo', region:'Muralha do Norte', img:'', px:786, py:192, locked:true, short:'Em breve', desc:'Em breve: fortificações, escudos e trabucos. Vence pelo desgaste.', tip:'', diff:0, stars:0, reward:'', tint:'rgba(100,120,150,.45)' },
];
const MY = ['Capitão', 'Cardeal', 'Mercenários'];
const $ = s => document.querySelector(s), MAPPX = 1150, ZOOM = MAPPX / 1024, PIN = { x:195, y:215 };
let cur = -1, myDeck = 0;
const PINSVG = '<svg viewBox="0 0 34 52"><path d="M17 51 C5 33 1 26 1 17 A16 16 0 0 1 33 17 C33 26 29 33 17 51Z" fill="#e0b04a" stroke="#3a2406" stroke-width="2"/><circle cx="17" cy="17" r="7" fill="#1a0f06" stroke="#3a2406" stroke-width="1.5"/><circle cx="17" cy="17" r="3.2" fill="#ffe9a6"/></svg>';
const stars = (n, locked) => locked ? '' : '<span class="stars">' + [0, 1, 2].map(i => `<i class="${i < n ? '' : 'off'}"></i>`).join('') + '</span>';
$('#list').innerHTML = OPP.map((o, i) => `<div class="row${o.locked ? ' locked' : ''}" data-i="${i}">${o.locked ? '' : `<div class="face" style="background-image:url('${o.img}')"></div>`}<div class="t"><h3>${o.gen}</h3><p>${o.locked ? 'Em breve' : o.epi}</p></div>${stars(o.stars, o.locked)}</div>`).join('');
document.querySelectorAll('.row').forEach(r => r.onclick = () => select(+r.dataset.i));
// marcadores das cidades (só aparecem com o mapa inteiro)
OPP.forEach((o, i) => { const m = document.createElement('div'); m.className = 'mk' + (o.locked ? ' lock' : ''); m.style.left = o.px * ZOOM + 'px'; m.style.top = o.py * ZOOM + 'px'; m.innerHTML = PINSVG; m.onclick = () => select(i); $('#map').appendChild(m); });
function overview() {
  const r = $('#stage').getBoundingClientRect(), s = Math.min(r.width, r.height - 8) / MAPPX, tx = (r.width - MAPPX * s) / 2, ty = (r.height - MAPPX * s) / 2 + 22;
  const map = $('#map'); map.classList.add('over'); map.style.setProperty('--inv', (.5 / s).toFixed(2)); map.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  $('#pin').classList.add('hide'); $('#place').classList.add('hide'); $('#info').innerHTML = ''; $('#hint').classList.remove('hide'); $('#tint').style.background = 'transparent';
}
function select(i) {
  document.querySelectorAll('.drawer').forEach(d => d.remove());
  if (i === cur) { cur = -1; document.querySelectorAll('.row').forEach(r => r.classList.remove('sel')); overview(); fightState(); return; }   // tocar de novo volta ao mapa inteiro
  const fromOverview = cur < 0; cur = i; const o = OPP[i];
  const tx = Math.min(0, Math.max(390 - MAPPX, PIN.x - o.px * ZOOM)), ty = Math.min(0, Math.max(560 - MAPPX, PIN.y - o.py * ZOOM));
  const map = $('#map'); map.classList.remove('over'); map.style.transform = `translate(${tx}px, ${ty}px) scale(1)`;
  if (!fromOverview) { const fx = $('#fx'); fx.classList.remove('hop'); void fx.offsetWidth; fx.classList.add('hop'); }
  $('#tint').style.background = o.tint; $('#pin').classList.toggle('locked', !!o.locked); $('#pin').classList.remove('hide'); $('#place').classList.remove('hide'); $('#hint').classList.add('hide');
  $('#region').textContent = o.region; $('#regsub').textContent = o.locked ? 'Região ainda inexplorada' : o.gen + ' · ' + o.epi;
  document.querySelectorAll('.row').forEach((r, k) => r.classList.toggle('sel', k === i));
  const chips = o.locked ? '<span class="chip">🔒 Ainda não disponível</span>' : `<span class="chip">Dificuldade ${'●'.repeat(o.diff)}${'○'.repeat(3 - o.diff)}</span><span class="chip">🎁 1ª vitória: ${o.reward}</span>`;
  const text = `<p>${o.desc}${o.tip ? ' <i style="opacity:.8">Dica: ' + o.tip + '</i>' : ''}</p><div class="chips">${chips}</div>`;
  const row = document.querySelector(`.row[data-i="${i}"]`);
  if (MODE === 'curto') $('#info').innerHTML = `<div class="one">${o.short}</div>`;
  else { $('#info').innerHTML = ''; const d = document.createElement('div'); d.className = 'drawer'; d.innerHTML = text; row.after(d); }
  fightState(); row.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
function fightState() {
  const f = $('#fight'), o = OPP[cur];
  f.classList.toggle('off', cur < 0 || !!(o && o.locked)); f.textContent = o && o.locked ? 'Em breve' : 'Lutar';
}
addEventListener('keydown', e => { if (e.key === 'ArrowDown') select(Math.min(OPP.length - 1, cur + 1)); if (e.key === 'ArrowUp') select(Math.max(0, cur - 1)); });
$('#deckchip').onclick = () => { myDeck = (myDeck + 1) % MY.length; $('#deckname').textContent = MY[myDeck]; };
$('#fight').onclick = () => { const o = OPP[cur]; if (o && !o.locked) { const b = $('#fight'); b.textContent = 'Preparando…'; setTimeout(() => { b.textContent = 'Lutar'; }, 1100); } };
addEventListener('resize', () => { if (cur < 0) overview(); });
overview(); fightState();
window.__select = select;
</script>
</body>
</html>
