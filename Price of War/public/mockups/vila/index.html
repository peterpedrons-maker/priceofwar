<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vila</title><style>
html,body{margin:0;height:100%;background:#0b0710;font-family:Georgia,serif;color:#f4e3b5}
#app{position:relative;width:100vw;height:100vh;max-width:430px;margin:0 auto;overflow:hidden;background:#150d1c url(menu-bg.webp) center/cover}
#app:before{content:"";position:absolute;inset:0;background:linear-gradient(#0b0710cc 0,#0000 18%,#0000 72%,#0b0710ee 100%)}
.top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.chip{background:#1b1220cc;border:1px solid #c9a35a;border-radius:20px;padding:5px 12px;display:flex;gap:6px;align-items:center}
.chip img{width:20px}
.b{position:absolute;transform:translate(-50%,-50%);width:92px;text-align:center;background:none;border:0;color:inherit;font:inherit;padding:0}
.b .zone{height:74px;border:2px dashed #ffd36a88;border-radius:14px;background:#ffd36a18;display:flex;align-items:center;justify-content:center;font-size:26px;animation:p 2.4s infinite}
@keyframes p{50%{background:#ffd36a38}}
.b span.n{display:block;margin-top:3px;font-size:12px;font-weight:bold;text-shadow:0 1px 3px #000,0 0 6px #000;background:#150d1ccc;border-radius:8px;padding:1px 4px}
.badge{position:absolute;top:-6px;right:-4px;background:#d12b2b;border:2px solid #fff;border-radius:50%;min-width:20px;height:20px;font:bold 12px/20px sans-serif;color:#fff}
.play{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:76%;height:62px;border-radius:14px;border:2px solid #ffe08a;background:linear-gradient(#e0a93a,#8e5a14);color:#2a1604;font:bold 24px Georgia;box-shadow:0 0 18px #ffb43a99}
.corner{position:absolute;bottom:26px;width:44px;height:44px;border-radius:50%;background:#1b1220cc;border:1px solid #c9a35a;display:flex;align-items:center;justify-content:center}
.corner img{width:26px}
.note{position:absolute;top:52px;left:0;right:0;text-align:center;font-size:11px;color:#ffd36a}
</style></head><body><div id="app">
<div class="top"><div class="chip">Peter · Nv 7</div><div class="chip"><img src="ui-icon-coroa.webp">1.250</div></div>
<div class="note">MOCKUP · fundo provisório; as caixas tracejadas marcam onde ficam os prédios da arte nova</div>
<button class="b" style="left:30%;top:24%"><div class="zone">🏰</div><span class="n">Quartel</span></button>
<button class="b" style="left:74%;top:31%"><div class="zone">⚔️</div><span class="n">Arena</span></button>
<button class="b" style="left:27%;top:40%"><div class="zone">📚</div><span class="n">Biblioteca</span></button>
<button class="b" style="left:72%;top:49%"><div class="zone">🔨</div><span class="n">Forja</span></button>
<button class="b" style="left:30%;top:57%"><div class="zone">🛒</div><span class="n">Mercado</span><i class="badge">!</i></button>
<button class="b" style="left:70%;top:66%"><div class="zone">📜</div><span class="n">Missões</span><i class="badge">3</i></button>
<button class="b" style="left:30%;top:72%"><div class="zone">🎓</div><span class="n">Academia</span></button>
<div class="corner" style="left:14px"><img src="ui-icon-config.webp"></div>
<div class="corner" style="right:14px;font-size:20px">⚙️</div>
<button class="play">Jogar</button>
</div></body></html>
