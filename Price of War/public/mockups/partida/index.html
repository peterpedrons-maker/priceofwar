<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prompts da partida com o kit (mockup)</title>
<style>
  @font-face { font-family:'Cinzel'; font-weight:400 900; font-display:swap; src:url(../desafios/fonts/cinzel-regular.woff2) format('woff2'); }
  @font-face { font-family:'Cinzel Decorative'; font-weight:700; font-display:swap; src:url(../desafios/fonts/cinzel-decorative-700.woff2) format('woff2'); }
  @font-face { font-family:'Crimson Pro'; font-weight:600; font-display:swap; src:url(../desafios/fonts/crimson-pro-600.woff2) format('woff2'); }
  :root { --gold2:#f6e3a3; --muted:#b9a77a; --serif:'Crimson Pro',Georgia,serif; --cin:'Cinzel',Georgia,serif; --dec:'Cinzel Decorative','Cinzel',Georgia,serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; background:#050403; color:#f3e8cc; font-family:var(--cin); overflow:hidden; }
  #app { position:relative; width:100%; max-width:430px; height:100dvh; margin:0 auto; overflow:hidden; background:#0a0705; }
  #bar { position:absolute; left:0; right:0; top:0; z-index:100; display:flex; gap:6px; padding:6px; background:rgba(8,5,3,.92); border-bottom:1px solid #4a3818; overflow-x:auto; scrollbar-width:none; }
  #bar::-webkit-scrollbar { display:none; }
  #bar button { all:unset; flex:none; cursor:pointer; padding:7px 11px; border-radius:14px; font:700 10.5px var(--cin); letter-spacing:.08em; text-transform:uppercase; color:#b9a77a; background:#1a120a; box-shadow:inset 0 0 0 1px #4a3818; }
  #bar button.on { color:#2a1604; background:linear-gradient(#f0d68a,#b88b2c); box-shadow:none; }
  #bar .sp { flex:1 0 8px; }
  #stage { position:absolute; inset:46px 0 0 0; overflow:hidden; background:#000; }
  body.limpo #bar { display:none; } body.limpo #stage { inset:0; }
  .bg { position:absolute; inset:0; background:url(img/board.jpg) center/100% 100% no-repeat; }
  .dim { position:absolute; inset:0; background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.84) 18%,rgba(0,0,0,.86)); }
  .abs { position:absolute; }

  /* ───── ANTES: a moldura fina dourada e os tons do jogo atual ───── */
  .a-box { border-style:solid; border-width:14px; border-image:url(img/frame.webp) 31 stretch; background:rgba(12,8,5,.9); background-clip:padding-box; }
  .a-btn { all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:center; text-align:center; border-style:solid; border-width:10px; border-image:url(img/frame.webp) 31 stretch; background-clip:padding-box; padding:3px 12px; font:700 var(--s,15px)/1.1 var(--cin); letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
  .a-btn.pri { background-color:rgba(24,100,58,.82); color:#eafff0; } .a-btn.neu { background-color:rgba(24,16,8,.78); color:#f0e0bb; } .a-btn.dan { background-color:rgba(104,24,24,.78); color:#ffd9d2; }
  .a-btn.off { background-color:rgba(34,28,22,.8); color:#a89c84; }

  /* ───── DEPOIS: peças do kit ───── */
  .btn { all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; min-height:42px; border-style:solid; border-width:8px 22px; border-image:url(../desafios/ui/btn-secondary.png) 20 56 20 56 fill stretch; font:700 var(--s,12px)/1.1 var(--cin); letter-spacing:.14em; color:var(--gold2); text-transform:uppercase; text-shadow:0 1px 2px #000; white-space:nowrap; }
  .btn.gold { min-height:46px; border-width:11px 24px; border-image:url(../desafios/ui/btn-primary.png) 20 80 20 80 fill stretch; font-weight:900; color:#2a1604; text-shadow:0 1px 0 rgba(255,255,255,.55); filter:drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  .btn.danger { border-image:url(../janelas/kit/perigo.png) 22 60 22 60 fill stretch; color:#ffd9d2; }
  .btn.off { border-image-source:url(../desafios/ui/btn-secondary-off.png); color:#8d8068; }
  .btn.gold.off { border-image-source:url(../desafios/ui/btn-primary-off.png); color:#5a4a2c; text-shadow:none; filter:none; }
  .btn.sm { min-height:36px; border-width:7px 16px; font-size:10.5px; letter-spacing:.12em; }
  .btn.lg { --s:14px; }
  .toast { border-style:solid; border-width:13px 16px; border-image:url(../janelas/kit/toast.png) 26 fill stretch; color:#f3e3c3; text-align:center; filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)); }
  .toast.red { filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)) hue-rotate(-20deg) saturate(1.3); }
  .toast b { font:700 11px var(--cin); letter-spacing:.16em; text-transform:uppercase; color:#cdb77c; display:block; margin-bottom:2px; }
  .toast p { margin:0; font:600 16px/1.25 var(--serif); }
  .toast.cin p { font:700 13px/1.3 var(--cin); letter-spacing:.1em; text-transform:uppercase; color:#ffe3a1; }
  .row { position:relative; display:flex; align-items:center; min-height:62px; padding:0 4px 0 8px; border-style:solid; border-width:11px 11px 11px 58px; border-image:url(../desafios/ui/panel-row.png) 22 22 22 112 fill stretch; cursor:pointer; }
  .row.sel { border-image-source:url(../desafios/ui/row-selected.png); filter:drop-shadow(0 0 7px rgba(240,200,100,.5)); }
  .row .sock { position:absolute; left:-52px; top:calc(50% - 20px); width:40px; height:40px; background:url(../janelas/kit/radio_off.png) center/contain no-repeat; }
  .row.sel .sock { background-image:url(../janelas/kit/radio_on.png); }
  .row h3 { margin:0; font:700 13.5px var(--cin); letter-spacing:.05em; text-transform:uppercase; color:var(--gold2); } .row p { margin:1px 0 0; font:600 13.5px/1.2 var(--serif); color:#cbb98c; }
  .row em { font-style:normal; color:#9fe0a8; }

  /* cartas e textos */
  .card { position:absolute; filter:drop-shadow(0 0 14px rgba(239,68,68,.9)); }
  .card.g { filter:drop-shadow(0 0 12px rgba(255,214,110,.95)); }
  .card img { display:block; width:100%; }
  .card.dis { filter:grayscale(.8) brightness(.6) drop-shadow(0 0 8px rgba(239,68,68,.8)); }
  .hd { text-align:center; text-shadow:0 2px 6px #000; }
  .hd.a b { display:block; font:800 17px var(--cin); letter-spacing:.08em; color:#f4dfa6; } .hd.a span { font:400 12px 'PT Serif',Georgia,serif; color:#e6d6ae; }
  .hd.d b { display:block; font:700 20px var(--dec); letter-spacing:.14em; padding-left:.14em; background:linear-gradient(#fff7d6,#ecca74 48%,#a8792a); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 1px rgba(0,0,0,.95)) drop-shadow(0 0 10px rgba(230,180,70,.3)); }
  .hd.d i { display:block; width:190px; height:10px; margin:6px auto 4px; background:url(../desafios/ui/divider.png) center/100% 100% no-repeat; }
  .hd.d span { font:600 14px/1.25 var(--serif); color:#e6d6ae; }
  .note { font:600 11px var(--serif); color:#ffb8a6; text-shadow:0 1px 3px #000; text-align:center; height:14px; }
  .tot { font:600 15px var(--serif); color:#e8d7ae; text-shadow:0 1px 4px #000; } .tot b { color:#ffd36a; }
  /* faixa verde da fase (réplica da barra do jogo) */
  .band { position:absolute; left:87px; top:386px; width:175px; height:17px; border-radius:3px; background:linear-gradient(#17c777,#07803f); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font:700 11px var(--cin); letter-spacing:.08em; color:#eafff0; text-shadow:0 1px 2px #000; white-space:nowrap; }
  .band { font-size:10.5px; } .band s { text-decoration:none; margin-left:5px; animation:nudge 1.1s ease-in-out infinite; } @keyframes nudge { 50% { transform:translateX(3px); } }
  .ring { position:absolute; width:28px; height:28px; border-radius:50%; border:2px solid #7dffc4; box-shadow:0 0 10px #5af0a8; animation:pulse 1.4s ease-out infinite; pointer-events:none; } @keyframes pulse { 0% { transform:scale(.8); opacity:.95; } 100% { transform:scale(1.5); opacity:0; } }
  .nxt { position:absolute; font:900 11px var(--cin); color:#9dffd0; text-shadow:0 0 6px #000; animation:nudge 1.1s ease-in-out infinite; }
  .cap { position:absolute; left:87px; width:175px; top:370px; text-align:center; font:700 8.5px var(--cin); letter-spacing:.16em; text-transform:uppercase; color:#e6d6ae; text-shadow:0 1px 3px #000, 0 0 6px #000; }
  .tip { position:absolute; left:40px; right:40px; top:304px; padding:2px 4px; animation:bob 1.8s ease-in-out infinite; } @keyframes bob { 50% { transform:translateY(-3px); } }
  .tip::after { content:''; position:absolute; left:calc(50% - 8px); bottom:-9px; border:8px solid transparent; border-top-color:#6f5324; border-bottom:0; filter:drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .tip.up::after { bottom:auto; top:-9px; left:auto; right:34px; border:8px solid transparent; border-bottom-color:#6f5324; border-top:0; }
  .endlab { position:absolute; left:268px; top:384px; width:52px; height:40px; background:linear-gradient(#e7c35a,#a97c1f); border-radius:4px; box-shadow:inset 0 0 0 1px #f6e3a3; display:flex; align-items:center; justify-content:center; text-align:center; font:800 8.5px/1.1 var(--cin); letter-spacing:.04em; color:#3a2406; text-transform:uppercase; }
  #legend { position:absolute; left:8px; right:8px; bottom:8px; z-index:50; font:600 11px/1.3 var(--serif); color:#d9cba4; background:rgba(0,0,0,.72); padding:6px 9px; border-radius:9px; pointer-events:none; }
  body.limpo #legend { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="stage"></div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const VIEWS = [
  { id:'hud', nome:'Tabuleiro' }, { id:'emb', nome:'Emboscada' }, { id:'man', nome:'Manutenção' }, { id:'rel', nome:'Relíquia' }, { id:'esc', nome:'Escolher carta' }, { id:'fase', nome:'Botão de fase' },
];
const q = new URLSearchParams(location.search);
let cur = q.get('v') || 'hud', antes = q.has('antes');
if (q.has('limpo')) document.body.classList.add('limpo');

const A = { // ANTES
  btn: (t, tone, s=15, extra='') => `<button class="a-btn ${tone}" style="--s:${s}px;${extra}">${t}</button>`,
  box: (inner, tint) => `<div class="a-box" style="${tint?`background:${tint}`:''}">${inner}</div>`,
};
const D = { // DEPOIS
  btn: (t, tone='', extra='') => `<button class="btn ${tone}" style="${extra}">${t}</button>`,
};

const hudTop = (a) => a
  ? `<div class="abs" style="left:12px;top:12px">${A.btn('Opções','neu',10)}</div><div class="abs" style="right:12px;top:12px">${A.btn('Sair','neu',10)}</div>`
  : `<div class="abs" style="left:12px;top:10px">${D.btn('Opções','sm')}</div><div class="abs" style="right:12px;top:10px">${D.btn('Sair','sm')}</div>`;

const SCENES = {
  hud: { antes: () => ``, depois: () => `
      <div class="abs" style="left:10px;right:10px;top:690px;height:0"></div>
      <div class="abs" style="left:0;right:0;top:44px;display:flex;justify-content:center;"></div>
      <div class="abs toast cin" style="left:44px;right:44px;top:664px;padding:2px 6px"><p>Arraste a carta para o campo</p></div>
      <div class="abs toast red" style="left:70px;right:70px;top:106px;padding:2px 6px"><p style="font:700 16px var(--serif);color:#f5deb3">Ouro insuficiente</p></div>`,
    cover: true, legenda: 'Tabuleiro: o "antes" é a captura real do jogo. Mudam só os botões do alto (Opções/Sair) e as caixas de aviso e de dica (por exemplo, "Arraste a carta para o campo" e o aviso de ouro insuficiente). A barra de fase e o ENCERRAR TURNO já têm arte própria e ficam como estão.' },
  emb: {
    antes: () => `<div class="abs" style="left:30px;right:30px;top:96px">${A.box(`<p style="margin:0;padding:2px 10px;text-align:center;color:#ffe3a1;font:700 13px/1.3 var(--cin);letter-spacing:.04em;text-transform:uppercase">O adversário ataca o seu General. Ativar uma Emboscada?</p>`,'rgba(54,10,10,.92)')}</div>
      <div class="card" style="left:calc(50% - 125px);top:230px;width:250px"><img src="img/card2.webp"></div>
      <div class="abs" style="left:35px;right:35px;top:722px;display:flex;gap:12px">${A.btn('Não ativar','neu',16,'flex:1')}${A.btn('Ativar','pri',16,'flex:1')}</div>`,
    depois: () => `<div class="abs toast red" style="left:24px;right:24px;top:70px;padding:4px 8px"><b>Emboscada!</b><p>O adversário ataca o seu General. Ativar uma Emboscada?</p></div>
      <div class="card" style="left:calc(50% - 125px);top:200px;width:250px"><img src="img/card2.webp"></div>
      <div class="abs" style="left:28px;right:28px;top:700px;display:flex;gap:12px">${D.btn('Não ativar','lg','flex:1')}${D.btn('Ativar','gold lg','flex:1')}</div>`,
    legenda: 'Emboscada: a pergunta vira uma faixa do kit (vermelha, como aviso de perigo) com um título curto; "Não ativar" é o botão escuro e "Ativar" é o dourado com espadas. Com várias cartas possíveis, cada uma ganha um Ativar dourado embaixo e há um "Não ativar" largo.' },
  man: {
    antes: () => `<div class="hd a abs" style="left:10px;right:10px;top:84px"><b>MANUTENÇÃO DA COMPANHIA</b><span>Você tem <b style="display:inline;color:#ffd36a;font:700 12px 'PT Serif'">9</b> de ouro. Quem não for pago vai embora.</span></div>
      ${[0,1,2].map(i => `<div class="card g ${i==2?'dis':''}" style="left:${14+i*122}px;top:152px;width:112px"><img src="img/card${i+1}.webp"></div>
        <div class="abs" style="left:${14+i*122}px;top:${152+175}px;width:112px">${A.btn(i==2?'Dispensar':'Pagar 2', i==2?'neu':'pri',13,'width:100%')}<div class="note" style="margin-top:4px">${i==2?'vai embora':''}</div></div>`).join('')}
      <div class="abs" style="left:24px;right:24px;top:730px;display:flex;align-items:center;gap:12px"><div class="tot" style="font-family:'PT Serif',serif;font-size:13px">Total: <b>4</b></div>${A.btn('Confirmar','pri',16,'flex:1')}</div>`,
    depois: () => `<div class="hd d abs" style="left:10px;right:10px;top:70px"><b>Manutenção</b><i></i><span>Você tem <b style="display:inline;font:700 15px var(--cin);color:#ffd36a;background:none;-webkit-text-fill-color:#ffd36a;filter:none;letter-spacing:0;padding:0">9</b> de ouro. Quem não for pago vai embora.</span></div>
      ${[0,1,2].map(i => `<div class="card g ${i==2?'dis':''}" style="left:${14+i*122}px;top:182px;width:112px"><img src="img/card${i+1}.webp"></div>
        <div class="abs" style="left:${10+i*122}px;top:${182+178}px;width:120px">${D.btn(i==2?'Dispensar':'Pagar 2', i==2?'':'gold','width:100%;--s:11px')}<div class="note" style="margin-top:5px">${i==2?'vai embora':''}</div></div>`).join('')}
      <div class="abs" style="left:22px;right:22px;top:716px;display:flex;align-items:center;gap:14px"><div class="tot">Total <b>4</b></div>${D.btn('Confirmar','gold lg','flex:1')}</div>`,
    legenda: 'Manutenção (Mercenários): título no mesmo estilo das janelas (Cinzel Decorativo dourado com divisor), "Pagar" dourado e "Dispensar" escuro, "Confirmar" dourado (apagado quando falta ouro). A carta dispensada continua apagada e vermelha.' },
  rel: {
    antes: () => `<div class="card g" style="left:calc(50% - 85px);top:90px;width:170px"><img src="img/card3.webp"></div>
      <div class="hd a abs" style="left:10px;right:10px;top:352px"><b style="font-size:16px">ESCOLHA O MODO</b><span>Vale até o fim do seu próximo turno (o adversário vê qual é).</span></div>
      <div class="abs" style="left:15px;right:15px;top:420px;display:flex;flex-direction:column;gap:7px">
        ${[['Ofensivo','+1 ATK a todas as suas unidades.',1],['Defensivo','+1 HP a todas as suas unidades.',0],['Econômico','Manutenção custa 1 a menos.',0]].map(([n,e,on]) => `<div style="padding:8px 12px;border-radius:10px;text-align:left;background:${on?'rgba(120,88,22,.82)':'rgba(20,14,8,.78)'};border:1.5px solid ${on?'#e8c766':'rgba(255,255,255,.2)'};${on?'box-shadow:0 0 14px rgba(232,199,102,.6)':''}"><div style="font:800 13.5px var(--cin);color:${on?'#fff1c9':'#e8dcc0'}">${n}</div><div style="font:400 11.5px 'PT Serif',serif;color:#d8c79e">${e}</div></div>`).join('')}
      </div>
      <div class="abs" style="left:15px;right:15px;top:680px;display:flex;gap:8px">${A.btn('Voltar','neu',15,'flex:1')}${A.btn('Encerrar turno','pri',15,'flex:2')}</div>`,
    depois: () => `<div class="card g" style="left:calc(50% - 85px);top:64px;width:170px"><img src="img/card3.webp"></div>
      <div class="hd d abs" style="left:10px;right:10px;top:338px"><b>Escolha o modo</b><i></i><span>Vale até o fim do seu próximo turno (o adversário vê qual é).</span></div>
      <div class="abs" style="left:54px;right:12px;top:436px;display:flex;flex-direction:column;gap:10px">
        ${[['Ofensivo','+1 ATK a todas as suas unidades.',1],['Defensivo','+1 HP a todas as suas unidades.',0],['Econômico','Manutenção custa 1 a menos.',0]].map(([n,e,on]) => `<div class="row ${on?'sel':''}"><span class="sock"></span><div><h3>${n}</h3><p>${e}</p></div></div>`).join('')}
      </div>
      <div class="abs" style="left:22px;right:22px;top:690px;display:flex;gap:10px">${D.btn('Voltar','lg','flex:1')}${D.btn('Encerrar turno','gold lg','flex:2')}</div>`,
    legenda: 'Escolha do modo da Relíquia: o título vira o das janelas e cada modo é uma linha do kit com um seletor redondo no encaixe (aceso no escolhido) em vez de uma caixa com borda dourada. "Encerrar turno" é o botão dourado.' },
  esc: {
    antes: () => `<div class="abs" style="left:0;right:0;top:100px;display:flex;justify-content:center">${A.box(`<p style="margin:0;padding:2px 12px;text-align:center;color:#ffe3a1;font:700 13px/1.3 var(--cin);letter-spacing:.04em;text-transform:uppercase;max-width:260px">Escolha 1 carta para ficar na mão</p>`)}</div>
      ${[0,1,2].map(i => `<div class="card" style="filter:${i==1?'drop-shadow(0 0 14px rgba(52,211,153,.95))':'none'};left:${16+i*122}px;top:${200+(i==1?-6:0)}px;width:112px;transform:${i==1?'scale(1.06)':'none'}"><img src="img/card${i+1}.webp"></div>`).join('')}
      <div class="abs" style="left:0;right:0;top:420px;display:flex;justify-content:center">${A.btn('Confirmar (1/1)','pri',12)}</div>`,
    depois: () => `<div class="hd d abs" style="left:10px;right:10px;top:78px"><b>Escolha uma carta</b><i></i><span>Ela vai para a sua mão.</span></div>
      ${[0,1,2].map(i => `<div class="card g" style="filter:${i==1?'drop-shadow(0 0 14px rgba(255,214,110,.95))':'drop-shadow(0 6px 8px rgba(0,0,0,.6))'};left:${16+i*122}px;top:${190+(i==1?-6:0)}px;width:112px;transform:${i==1?'scale(1.06)':'none'}"><img src="img/card${i+1}.webp"></div>`).join('')}
      <div class="abs" style="left:60px;right:60px;top:400px">${D.btn('Confirmar (1/1)','gold lg','width:100%')}</div>`,
    legenda: 'Escolher carta (buscar no baralho, descartar, etc.): título no estilo das janelas com uma frase de apoio, a carta escolhida brilha em dourado (hoje é verde) e "Confirmar" é o botão dourado.' },
};

const FASE = {
  h: { t:'Hoje', l:'Hoje: a faixa mostra só o nome da fase atual ("Preparação »"). Não diz que é um botão nem o que o toque faz.' },
  a: { t:'A · Próxima fase', l:'A: "PRÓXIMA FASE »" em todas as fases. Curto e igual sempre; o nome da fase atual continua nos medalhões (o aceso é a fase de agora).' },
  b: { t:'B · Encerrar fase', l:'B (recomendo): "ENCERRAR PREPARAÇÃO »", "ENCERRAR COMBATE »", "ENCERRAR MOVIMENTO »". Combina com o botão ao lado ("ENCERRAR TURNO") e diz a ação. O próximo medalhão pulsa de leve para mostrar para onde vai.' },
  c: { t:'C · Só visual', l:'C: sem texto novo. A faixa continua com o nome da fase, mas a seta » anda e o PRÓXIMO medalhão pulsa. Quem nunca viu entende que "vai para lá".' },
};
let vr = q.get('w') || 'b';
// medalhões da barra (css px, medidos na captura): x = 87,5 + 175 × [.1086 .2986 .4886 .6786 .8686], y ≈ 412
const MED = [106.5, 139.7, 173, 206.3, 239.5];
function faseBody() {
  let h = '';
  const pulse = (i) => `<div class="ring" style="left:${MED[i]-14}px;top:${398}px"></div>`;
  if (vr === 'a') h += `<div class="band">PRÓXIMA FASE<s>››</s></div>`;
  if (vr === 'b') h += `<div class="band">ENCERRAR PREPARAÇÃO<s>››</s></div>` + pulse(3);
  if (vr === 'c') h += `<div class="band">PREPARAÇÃO<s>››</s></div>` + pulse(3);
  return h;
}
function render() {
  if (cur === 'fase') {
    $('#bar').innerHTML = VIEWS.map(v => `<button class="${v.id===cur?'on':''}" data-v="${v.id}">${v.nome}</button>`).join('') + '<span class="sp"></span>' + ['h','a','b','c'].map(k => `<button class="${vr===k?'on':''}" data-w="${k}">${FASE[k].t}</button>`).join('');
    $('#stage').innerHTML = `<div class="bg" style="background-image:url(img/board-clean.jpg)"></div>${vr==='h'?'':faseBody()}<div id="legend">${FASE[vr].l}</div>`;
    document.querySelectorAll('#bar button').forEach(b => b.onclick = () => { if (b.dataset.v) cur = b.dataset.v; if (b.dataset.w) vr = b.dataset.w; render(); });
    return;
  }
  const sc = SCENES[cur];
  $('#bar').innerHTML = VIEWS.map(v => `<button class="${v.id===cur?'on':''}" data-v="${v.id}">${v.nome}</button>`).join('') + '<span class="sp"></span>' +
    `<button class="${antes?'':'on'}" data-m="d">Depois</button><button class="${antes?'on':''}" data-m="a">Antes</button>`;
  const hud = cur === 'hud';
  const bgDim = hud ? '' : '<div class="dim"></div>';
  const body = hud
    ? (antes ? '' : sc.depois() + hudTop(false))
    : (antes ? sc.antes() : sc.depois());
  $('#stage').innerHTML = `<div class="bg" style="background-image:url(img/${hud && antes ? 'board' : 'board-clean'}.jpg)"></div>${bgDim}${body}<div id="legend">${antes ? '<b>ANTES (hoje):</b> ' : '<b>DEPOIS (kit):</b> '}${sc.legenda}</div>`;
  document.querySelectorAll('#bar button').forEach(b => b.onclick = () => { if (b.dataset.v) cur = b.dataset.v; if (b.dataset.m) antes = b.dataset.m === 'a'; render(); });
}
render();
</script>
</body>
</html>
