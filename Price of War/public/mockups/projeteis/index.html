<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projéteis do combate</title>
<style>
  :root { --gold:#e6c36a; --ink:#1a1410; --panel:#2a2018; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#0d0a07; color:#eadfc6; font-family: Georgia, 'Times New Roman', serif; overflow:hidden; touch-action: manipulation; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { padding:8px 12px 4px; text-align:center; flex:none; }
  header h1 { font-size:15px; letter-spacing:.14em; margin:0; color:var(--gold); text-transform:uppercase; }
  header p { margin:2px 0 0; font-size:11px; color:#a99d84; min-height:28px; line-height:1.25; }
  #holder { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #stage { position:relative; width:390px; height:640px; flex:none; transform-origin:center center; border-radius:10px; overflow:hidden; background:#000; box-shadow:0 0 0 1px #3a2c1c, 0 10px 40px #000; }
  #bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.82) saturate(.95); }
  .slot { position:absolute; width:64px; height:94px; transform:translate(-50%,-50%); border-radius:6px; border:1px dashed rgba(255,255,255,.12); background:rgba(0,0,0,.18); }
  .card { position:absolute; width:64px; transform:translate(-50%,-50%); border-radius:6px; box-shadow:0 4px 10px rgba(0,0,0,.7); user-select:none; -webkit-user-drag:none; will-change:transform, filter; }
  .card.big { width:68px; }
  .card.hit { animation: hit .5s ease-out; }
  .card.hit2 { animation: hit2 .5s ease-out; }
  @keyframes hit  { 0%{transform:translate(-50%,-50%) scale(1); filter:brightness(1)} 10%{transform:translate(calc(-50% - 7px),calc(-50% + 4px)) scale(.94) rotate(-4deg); filter:brightness(2.6) saturate(.6)} 30%{transform:translate(calc(-50% + 6px),calc(-50% - 3px)) scale(.97) rotate(3deg); filter:brightness(1.6)} 55%{transform:translate(calc(-50% - 3px),-50%) rotate(-1.5deg); filter:brightness(1.2)} 100%{transform:translate(-50%,-50%) scale(1) rotate(0); filter:brightness(1)} }
  @keyframes hit2 { 0%{transform:translate(-50%,-50%)} 12%{transform:translate(calc(-50% + 7px),calc(-50% + 3px)) rotate(4deg); filter:brightness(2.4)} 35%{transform:translate(calc(-50% - 5px),calc(-50% - 2px)) rotate(-3deg); filter:brightness(1.5)} 60%{transform:translate(calc(-50% + 2px),-50%)} 100%{transform:translate(-50%,-50%) rotate(0); filter:brightness(1)} }
  .card.windup { animation: windup .42s ease-in-out; }
  @keyframes windup { 0%{transform:translate(-50%,-50%)} 55%{transform:translate(-50%,calc(-50% + 14px)) scale(.96)} 75%{transform:translate(-50%,calc(-50% - 10px)) scale(1.08)} 100%{transform:translate(-50%,-50%)} }
  .card.kick { animation: kick .4s ease-out; }
  @keyframes kick { 0%{transform:translate(-50%,-50%)} 20%{transform:translate(-50%,calc(-50% + 9px)) scale(.97)} 100%{transform:translate(-50%,-50%)} }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .num { position:absolute; transform:translate(-50%,-50%); font:900 30px/1 Georgia,serif; color:#fff; letter-spacing:-.02em; pointer-events:none;
         text-shadow: 0 0 2px #7a1208, 0 2px 0 #b3200f, 0 -1px 0 #b3200f, 2px 0 0 #b3200f, -2px 0 0 #b3200f, 0 4px 6px rgba(0,0,0,.8); -webkit-text-stroke: 1px #c0240f; animation: num 1.5s ease-out forwards; }
  @keyframes num { 0%{transform:translate(-50%,-50%) scale(.3); opacity:0} 10%{transform:translate(-50%,-62%) scale(1.5); opacity:1} 25%{transform:translate(-50%,-80%) scale(1.15)} 70%{transform:translate(-50%,-125%) scale(1.15); opacity:1} 100%{transform:translate(-50%,-170%) scale(.95); opacity:0} }
  nav { flex:none; padding:6px 8px calc(8px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:linear-gradient(#0d0a07,#17110b); }
  nav button { appearance:none; border:1px solid #6b5326; background:linear-gradient(#3a2c1a,#241a10); color:#f1dfae; font:700 12px Georgia,serif; letter-spacing:.04em; padding:9px 4px; border-radius:8px; }
  nav button small { display:block; font-weight:400; font-size:9.5px; color:#b9a77d; margin-top:1px; letter-spacing:0; }
  nav button:active { background:#4b381f; }
  nav button.on { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  #opts { grid-column:1/-1; display:flex; gap:8px; justify-content:center; font-size:11px; color:#c9b88f; }
  #opts label { display:flex; align-items:center; gap:5px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Projéteis do combate</h1>
    <p id="cap">Toque num botão para ver o ataque. (Mockup: ainda não está no jogo.)</p>
  </header>
  <div id="holder">
    <div id="stage">
      <img id="bg" src="board-battlefield.webp" alt="">
      <div id="cards"></div>
      <canvas id="fx"></canvas>
      <div id="nums"></div>
    </div>
  </div>
  <nav>
    <button data-a="catapulta">Catapulta<small>área de uma fileira</small></button>
    <button data-a="trabuco">Trabuco<small>campo inteiro</small></button>
    <button data-a="balestra">Balestra<small>virote certeiro</small></button>
    <button data-a="lanca">Lança do Jorge<small>atravessa duas cartas</small></button>
    <button data-a="arqueiro">Arqueiro<small>flechas em arco</small></button>
    <button data-a="seta">Hoje (seta)<small>para comparar</small></button>
    <div id="opts">
      <label><input type="checkbox" id="slow"> câmera lenta (¼)</label>
      <label><input type="checkbox" id="snd" checked> som de teste</label>
    </div>
  </nav>
</div>

<script>
'use strict';
const W = 390, H = 640;
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);

// ── stage layout ──────────────────────────────────────────────────────────────────────────────────────────────────
const COLX = [55, 125, 195, 265, 335];
const ROW = { eGen: 50, eBack: 142, eFront: 234, pFront: 410, pBack: 502, pGen: 592 };
const CARDS = [
  // enemy
  ['comandante-aurelion-mestre-da-formacao', 195, ROW.eGen, 'big'],
  ['arqueiro-da-ordem', COLX[1], ROW.eBack], ['cavaleiro-hospitalario', COLX[3], ROW.eBack], ['atirador-da-cruzada', COLX[2], ROW.eBack],
  ['escudeiro-de-linha', COLX[0], ROW.eFront], ['soldado-tatico', COLX[1], ROW.eFront], ['veterano-de-guerra', COLX[2], ROW.eFront], ['batedor', COLX[3], ROW.eFront], ['lanceiro-de-controle', COLX[4], ROW.eFront],
  // player
  ['soldados-da-ordem', COLX[1], ROW.pFront], ['jorge-lanca-sagrada', COLX[2], ROW.pFront], ['cavaleiro-da-luz', COLX[3], ROW.pFront],
  ['arqueiro-da-ordem', COLX[1], ROW.pBack], ['nobre-da-cruzada', COLX[3], ROW.pBack],
  ['cardeal-pedro-voz-da-fe', 195, ROW.pGen, 'big'],
];
const els = [];
const cardsEl = $('#cards');
for (const row of [ROW.eBack, ROW.eFront, ROW.pFront, ROW.pBack]) for (const x of COLX) {
  const s = document.createElement('div'); s.className = 'slot'; s.style.left = x + 'px'; s.style.top = row + 'px'; cardsEl.appendChild(s);
}
const cardAt = {};
CARDS.forEach(([n, x, y, cls]) => {
  const im = document.createElement('img'); im.className = 'card ' + (cls || ''); im.src = `../quarto/cards/${n}.webp`; im.style.left = x + 'px'; im.style.top = y + 'px'; im.draggable = false;
  cardsEl.appendChild(im); els.push(im); cardAt[n + '@' + x + ',' + y] = im; im.dataset.x = x; im.dataset.y = y;
});
const enemyCards = els.filter(e => +e.dataset.y <= ROW.eFront);
const cardByPos = (x, y) => els.find(e => +e.dataset.x === x && +e.dataset.y === y);

// ── scale the stage to the screen ────────────────────────────────────────────────────────────────────────────────
const stage = $('#stage'), cv = $('#fx'), ctx = cv.getContext('2d');
let RES = 2;
function fit() {
  const h = $('#holder').getBoundingClientRect();
  const k = Math.min(h.width / W, h.height / H);
  stage.style.transform = `scale(${k})`;
  RES = Math.min(3, (window.devicePixelRatio || 1) * k);
  cv.width = Math.round(W * RES); cv.height = Math.round(H * RES);
}
addEventListener('resize', fit); fit();

// ── assets ────────────────────────────────────────────────────────────────────────────────────────────────────────
const IMG = {};
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = r; i.src = src; });
const ready = Promise.all([load('fire', 'fx-boom-fire.webp'), load('smoke', 'fx-boom-smoke.webp'), load('holy', 'fx-holy.webp'), load('puff', 'fx-puff.webp'), load('debris', 'fx-debris.webp'),
  load('rock', 'proj-rock.webp'), load('bolt', 'proj-bolt.webp'), load('arrow', 'proj-arrow.webp'), load('lance', 'proj-lance.webp')]);

// ── sound (the game's own sounds + a synthesized whoosh) ───────────────────────────────────────────────────────────
let AC = null; const BUF = {};
function audio() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); ['boom', 'hit', 'dano'].forEach(n => fetch(n + '.wav').then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(d => BUF[n] = d).catch(() => {})); } if (AC.state === 'suspended') AC.resume(); return AC; }
const sndOn = () => $('#snd').checked && AC && speed === 1;
function play(name, when, vol = 1, rate = 1, offset = 0) {
  if (!sndOn() || !BUF[name]) return;
  const s = AC.createBufferSource(); s.buffer = BUF[name]; s.playbackRate.value = rate; const g = AC.createGain(); g.gain.value = vol; s.connect(g).connect(AC.destination);
  s.start(AC.currentTime + Math.max(0, when), Math.max(0, offset));
}
function whoosh(when, dur, vol = .5, f0 = 400, f1 = 1800) {
  if (!sndOn()) return;
  const n = Math.ceil(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  const t = AC.currentTime + when; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .55); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}

// ── tiny simulation: timeline of things that draw themselves ────────────────────────────────────────────────────────
let now = 0, speed = 1; const fxs = []; const sched = [];
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const eo = u => 1 - Math.pow(1 - clamp(u), 3), ei = u => clamp(u) * clamp(u);
const at = (delay, fn) => sched.push({ t: now + delay, fn });
const add = (o) => { o.t0 = o.t0 ?? now; fxs.push(o); return o; };

function sprite(img, cols, size, frame, x, y, sc, alpha, mode, ax = .5, ay = .5, flip = 1) {
  const c = frame % cols, r = Math.floor(frame / cols);
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = mode || 'source-over';
  ctx.translate(x, y); ctx.scale(sc * flip, sc);
  ctx.drawImage(img, c * size, r * size, size, size, -size * ax, -size * ay, size, size);
  ctx.restore();
}

// ── effects ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// the fireball: smoke under (normal), fire over (additive). Frame centre of the blast is at (50%, 60%) of the frame.
const FS = .72;   // the blasts are drawn smaller than the sprite sheet
function explosion(x, y, sc = 1, delay = 0, flip = 1) {
  sc *= FS; const dur = 1.25, f = flip < 0 ? -1 : 1;
  at(delay, () => add({ dur, draw(p) {
    const fr = Math.min(29, Math.floor(p * 30));
    sprite(IMG.smoke, 6, 256, fr, x, y, sc, 1, 'source-over', .5, .6, f);
    sprite(IMG.fire, 6, 256, fr, x, y, sc, 1, 'lighter', .5, .6, f);
  } }));
}
function holy(x, y, sc = 1, delay = 0) {
  at(delay, () => add({ dur: 1.0, draw(p) { sprite(IMG.holy, 6, 256, Math.min(23, Math.floor(p * 24)), x, y, sc, 1, 'lighter'); } }));
}
function flash(x, y, r, color = '255,190,90', a = .55, dur = .28) {
  add({ dur, draw(p) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); const al = a * (1 - p) * (1 - p);
    g.addColorStop(0, `rgba(${color},${al})`); g.addColorStop(1, `rgba(${color},0)`); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); } });
}
function shock(x, y, r, dur = .55, color = '255,226,170', w = 5) {
  add({ dur, draw(p) { const e = eo(p), rx = r * e, al = (1 - p) * (1 - p) * .6;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${color},${al})`; ctx.lineWidth = w * (1 - p) * .7 + .8;
    ctx.beginPath(); ctx.ellipse(x, y, rx, rx * .42, 0, 0, Math.PI * 2); ctx.stroke();
    const g = ctx.createRadialGradient(x, y, rx * .5, x, y, rx); g.addColorStop(0, 'rgba(255,200,120,0)'); g.addColorStop(1, `rgba(255,200,120,${al * .18})`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rx, rx * .42, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); } });
}
function scorch(x, y, rx, dur = 2.6) {
  add({ dur, draw(p) { const al = .5 * Math.min(1, p * 8) * (1 - p); const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
    g.addColorStop(0, `rgba(10,6,3,${al})`); g.addColorStop(1, 'rgba(10,6,3,0)'); ctx.save(); ctx.translate(x, y); ctx.scale(1, .45); ctx.translate(-x, -y); ctx.fillStyle = g; ctx.fillRect(x - rx, y - rx, rx * 2, rx * 2); ctx.restore(); } });
}
function puff(x, y, vx, vy, size, life, a = .6, grow = 2.2, tint = 0) {
  const k = Math.floor(Math.random() * 4), rot = R(0, 6.28), vr = R(-1, 1);
  add({ dur: life, draw(p) { const px = x + vx * p * life, py = y + vy * p * life; const s = size * (1 + grow * eo(p)) / 128;
    ctx.save(); ctx.globalAlpha = a * (1 - p) * Math.min(1, p * 10); ctx.translate(px, py); ctx.rotate(rot + vr * p);
    ctx.drawImage(IMG.puff, k * 128, 0, 128, 128, -64 * s, -64 * s, 128 * s, 128 * s); ctx.restore(); } });
}
function dust(x, y, spread, n = 10, size = 46) {
  for (let i = 0; i < n; i++) { const a = R(0, Math.PI * 2), sp = R(.35, 1) * spread; puff(x + Math.cos(a) * 8, y + Math.sin(a) * 4, Math.cos(a) * sp / .9, Math.sin(a) * sp * .4 / .9, R(.6, 1) * size, R(.7, 1.1), .55, 1.6); }
}
function debris(x, y, n = 9, power = 1) {
  for (let i = 0; i < n; i++) {
    const vx = R(-190, 190) * power, vy = -R(170, 360) * power, g = 760, k = Math.floor(Math.random() * 4), sz = R(10, 24) * Math.min(1.4, .6 + power * .5), rot0 = R(0, 6.28), vr = R(-9, 9), life = R(.8, 1.15);
    add({ dur: life, draw(p) { const t = p * life; const px = x + vx * t, py = Math.min(y + 30, y + vy * t + .5 * g * t * t);
      ctx.save(); ctx.globalAlpha = 1 - ei((p - .75) / .25); ctx.translate(px, py); ctx.rotate(rot0 + vr * t); ctx.drawImage(IMG.debris, k * 64, 0, 64, 64, -sz / 2, -sz / 2, sz, sz); ctx.restore(); } });
    // ember trail
    if (i % 2 === 0) add({ dur: life, draw(p) { const t = p * life; const px = x + vx * t, py = y + vy * t + .5 * g * t * t; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,150,40,${.8 * (1 - p)})`; ctx.beginPath(); ctx.arc(px, py, 2.2 * (1 - p) + .5, 0, 7); ctx.fill(); ctx.restore(); } });
  }
}
function sparks(x, y, n = 14, power = 1, color = '255,210,110') {
  for (let i = 0; i < n; i++) {
    const a = R(0, Math.PI * 2), sp = R(80, 300) * power, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp * .8 - 90, g = 520, life = R(.35, .8);
    add({ dur: life, draw(p) { const t = p * life, t2 = Math.max(0, t - .045); const px = x + vx * t, py = y + vy * t + .5 * g * t * t, qx = x + vx * t2, qy = y + vy * t2 + .5 * g * t2 * t2;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${color},${1 - p})`; ctx.lineWidth = 2 * (1 - p) + .6; ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(px, py); ctx.stroke(); ctx.restore(); } });
  }
}
function hit(el, delay = 0, alt = false) { at(delay, () => { el.classList.remove('hit', 'hit2'); void el.offsetWidth; el.classList.add(alt ? 'hit2' : 'hit'); }); }
function num(x, y, text, delay = 0, size = 30) { at(delay, () => { const d = document.createElement('div'); d.className = 'num'; d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; $('#nums').appendChild(d); setTimeout(() => d.remove(), 1600 / speed); }); }

// A projectile that flies from a to b. `arc` is the height of the arc (0 = straight line, as with a bolt).
function fly({ img, cols = 1, frame = 0, size, from, to, dur, arc = 0, scale = [1, 1], spin = 0, trail = 'none', onEnd, aim = false, shadow = false, glow = null, ribbon = null, orb = 0, ease = x => x }) {
  const pos = []; let acc = 0, last = 0;
  const o = add({ dur, draw(p) {
    const u = ease(p);
    const gx = from.x + (to.x - from.x) * u, gy = from.y + (to.y - from.y) * u;
    const h = arc ? 4 * u * (1 - u) : 0;              // 0..1 height above the ground line
    const x = gx, y = gy - arc * h;
    const ang = aim ? Math.atan2((to.y - from.y) - (arc ? arc * 4 * (1 - 2 * u) : 0), to.x - from.x) : spin * p * dur;
    const sc = scale[0] + (scale[1] - scale[0]) * u + (arc ? .55 * h : 0);
    if (shadow) { ctx.save(); ctx.globalAlpha = .38 * (1 - h * .55); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(gx, gy + 6, 17 * sc * (1 - h * .35), 6 * sc * (1 - h * .35), 0, 0, 7); ctx.fill(); ctx.restore(); }
    // trail
    const dt = (p - last) * dur; last = p; acc += dt;
    while (acc > 0.014) { acc -= 0.014;
      if (trail === 'smoke' || trail === 'fire') puff(x + R(-4, 4), y + R(-4, 4), R(-14, 14), R(-8, 16), R(26, 40) * sc, R(.55, .9), trail === 'fire' ? .5 : .42, 1.7);
      if (trail === 'fire') add({ dur: .45, draw(pp) { const s = 8 * (1 - pp) + 1; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,${120 + 90 * (1 - pp) | 0},40,${.9 * (1 - pp)})`; ctx.beginPath(); ctx.arc(x + R(-3, 3), y + R(-3, 3) + pp * 14, s, 0, 7); ctx.fill(); ctx.restore(); } });
      if (trail === 'gold') add({ dur: .5, draw(pp) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,230,140,${.9 * (1 - pp)})`; ctx.beginPath(); ctx.arc(x + R(-4, 4), y + R(-4, 4), 3.2 * (1 - pp) + .6, 0, 7); ctx.fill(); ctx.restore(); } });
    }
    if (ribbon) { pos.push([x, y]); if (pos.length > ribbon.n) pos.shift();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      for (let i = 1; i < pos.length; i++) { const k = i / pos.length; ctx.strokeStyle = `rgba(${ribbon.c},${k * .75})`; ctx.lineWidth = ribbon.w * k; ctx.beginPath(); ctx.moveTo(pos[i - 1][0], pos[i - 1][1]); ctx.lineTo(pos[i][0], pos[i][1]); ctx.stroke(); }
      ctx.restore(); }
    if (glow) { const g = ctx.createRadialGradient(x, y, 0, x, y, glow.r); g.addColorStop(0, `rgba(${glow.c},${glow.a})`); g.addColorStop(1, `rgba(${glow.c},0)`); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - glow.r, y - glow.r, glow.r * 2, glow.r * 2); ctx.restore(); }
    if (orb) { const r = orb * sc; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,255,235,1)'); g.addColorStop(.35, 'rgba(255,200,90,.95)'); g.addColorStop(.75, 'rgba(255,100,20,.5)'); g.addColorStop(1, 'rgba(255,60,10,0)');
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }
    if (img) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(sc, sc);
      const iw = size[0], ih = size[1];
      if (img === IMG.rock) { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8; ctx.filter = 'brightness(.78) contrast(1.25)'; }
      else { ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 5; }
      ctx.drawImage(img, frame * iw, 0, iw, ih, -iw / 2, -ih / 2, iw, ih); ctx.restore();
    }
  }, end() { onEnd && onEnd(); } });
  return o;
}

// ── the attacks ───────────────────────────────────────────────────────────────────────────────────────────────────


// direction of an arc at u (screen space), used so a stuck arrow keeps the angle it arrived with
function arcTangent(from, to, arc, u) { return Math.atan2((to.y - from.y) - arc * 4 * (1 - 2 * u), to.x - from.x); }
// a projectile stuck in a card: its tip is at `to`, it sinks in a little, wobbles and fades
function stick(img, size, to, ang, sc, life, sink = 14) {
  const cx = to.x - Math.cos(ang) * (size[0] * sc / 2 - sink), cy = to.y - Math.sin(ang) * (size[0] * sc / 2 - sink);
  add({ dur: life, draw(p) { const wob = Math.sin(p * 46) * 0.07 * Math.exp(-p * 7); ctx.save(); ctx.globalAlpha = 1 - ei((p - .6) / .4); ctx.translate(to.x, to.y); ctx.rotate(wob);
    ctx.translate(cx - to.x, cy - to.y); ctx.rotate(ang); ctx.scale(sc, sc); ctx.drawImage(img, 0, 0, size[0], size[1], -size[0] / 2, -size[1] / 2, size[0], size[1]); ctx.restore(); } });
}
function ring(x, y, r, dur = .3, color = '255,226,150', w = 3) {
  add({ dur, draw(p) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${color},${(1 - p) * .9})`; ctx.lineWidth = w * (1 - p) + .5; ctx.beginPath(); ctx.arc(x, y, r * eo(p), 0, 7); ctx.stroke(); ctx.restore(); } });
}
// thin rays that shoot out and vanish (a crisp "hit" mark instead of a blob)
function burst(x, y, n = 8, len = 46, color = '255,236,170', dur = .22, a0 = 0, spread = Math.PI * 2) {
  for (let i = 0; i < n; i++) { const a = a0 + (i / n) * spread + R(-.12, .12), L = len * R(.6, 1);
    add({ dur, draw(p) { const r0 = L * .25 * eo(p), r1 = L * eo(p); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${color},${1 - p})`; ctx.lineWidth = 2.4 * (1 - p) + .6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.stroke(); ctx.restore(); } }); }
}
// sparks thrown in a cone around `ang`
function sparksDir(x, y, ang, cone = .8, n = 8, power = 1, color = '255,210,110') {
  for (let i = 0; i < n; i++) {
    const a = ang + R(-cone, cone), sp = R(90, 280) * power, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp - 40, g = 520, life = R(.25, .6);
    add({ dur: life, draw(p) { const t = p * life, t2 = Math.max(0, t - .04); const px = x + vx * t, py = y + vy * t + .5 * g * t * t, qx = x + vx * t2, qy = y + vy * t2 + .5 * g * t2 * t2;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${color},${1 - p})`; ctx.lineWidth = 1.8 * (1 - p) + .5; ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(px, py); ctx.stroke(); ctx.restore(); } });
  }
}
// a lens-flare cross: two thin streaks that flare and vanish (a clean 'hit' instead of a glowing disc)
function glint(x, y, L, dur = .26) {
  add({ dur, draw(p) { const k = Math.sin(Math.PI * Math.min(1, p * 1.15)), l = L * (.5 + .5 * eo(p));
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y);
    for (const rot of [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4]) { const len = rot === 0 || rot === Math.PI / 2 ? l : l * .55; ctx.save(); ctx.rotate(rot); const g = ctx.createLinearGradient(-len, 0, len, 0);
      g.addColorStop(0, 'rgba(255,240,190,0)'); g.addColorStop(.5, `rgba(255,252,235,${k})`); g.addColorStop(1, 'rgba(255,240,190,0)'); ctx.fillStyle = g; ctx.fillRect(-len, -1.6, len * 2, 3.2); ctx.restore(); }
    ctx.restore(); } });
}
// a clean impact: tight flash, rays, a thin ring, forward sparks and a small holy glow behind
function cleanHit(x, y, ang, k = 1) {
  flash(x, y, 56 * k, '255,238,180', .7, .15); glint(x, y, 46 * k); ring(x, y, 38 * k, .26); burst(x, y, 9, 52 * k, '255,240,190', .2);
  sparksDir(x, y, ang, .9, 9, 1 * k, '255,236,160');
}
function lanceFade(x, y) { for (let i = 0; i < 14; i++) add({ dur: R(.4, .8), draw(p) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,226,140,${1 - p})`; ctx.beginPath(); ctx.arc(x + R(-4, 4) + (i - 7) * 4 * p, y - 20 * p + R(-3, 3), 2.2 * (1 - p) + .5, 0, 7); ctx.fill(); ctx.restore(); } }); }
// the bolt hits: a thunk. No fire: a short flash on the armour, metal sparks thrown back, wood chips and a puff of dust.
function thunk(x, y, ang) {
  flash(x, y, 46, '255,244,210', .8, .13); ring(x, y, 26, .22, '255,244,210', 2.2); burst(x, y, 6, 30, '255,244,210', .16, ang + Math.PI - .9, 1.8);
  sparksDir(x, y, ang + Math.PI, .75, 10, .9, '255,236,170'); puff(x, y + 2, 0, -10, 24, .42, .4, 1.3);
  for (let i = 0; i < 6; i++) { const a = ang + Math.PI + R(-1.1, 1.1), sp = R(60, 170), vx = Math.cos(a) * sp, vy = Math.sin(a) * sp - 50, life = R(.35, .6), sz = R(1.6, 3);
    add({ dur: life, draw(p) { const t = p * life; ctx.save(); ctx.globalAlpha = 1 - p; ctx.fillStyle = '#c9a36a'; ctx.fillRect(x + vx * t, y + vy * t + 380 * t * t, sz, sz * .7); ctx.restore(); } }); }
}

// ── tactic cards: they land on the board, glow, and the effect comes out of them ─────────────────────────────────────
const TAC = { x: 195, y: 322 };
let tacEl = null;
function landTactic(name, onLaunch) {
  if (tacEl) tacEl.remove();
  const im = document.createElement('img'); im.className = 'card big tac'; im.src = `../quarto/cards/${name}.webp`; im.draggable = false;
  im.style.left = TAC.x + 'px'; im.style.top = TAC.y + 'px'; im.style.width = '80px'; im.style.opacity = 0; im.style.zIndex = 5; cardsEl.appendChild(im); tacEl = im;
  const anim = (kf, opt) => { const a = im.animate(kf, { fill: 'forwards', ...opt }); a.playbackRate = speed; return a; };
  const T = 'translate(-50%,-50%)';
  at(0, () => {
    anim([{ opacity: 0, transform: `${T} translateY(-150px) scale(2.2) rotate(-9deg)` }, { opacity: 1, transform: `${T} translateY(0) scale(1) rotate(0)`, offset: .56 },
      { transform: `${T} scale(1.16,.84)`, offset: .68 }, { transform: `${T} scale(.97,1.05)`, offset: .83 }, { opacity: 1, transform: `${T} scale(1)` }], { duration: 560, easing: 'cubic-bezier(.45,0,.9,.55)' });
  });
  at(.31, () => { play('dano', 0, .5, .6); dust(TAC.x, TAC.y + 34, 90, 8, 36); shock(TAC.x, TAC.y + 36, 80, .45, '255,226,170', 3); add({ dur: 1.4, draw(p) { ctx.save(); ctx.globalAlpha = .35 * (1 - p); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(TAC.x + 4, TAC.y + 50, 40, 10, 0, 0, 7); ctx.fill(); ctx.restore(); } }); });
  // charge: gold light is drawn into the card, which glows
  at(.5, () => {
    anim([{ filter: 'brightness(1) drop-shadow(0 0 0 rgba(255,210,110,0))' }, { filter: 'brightness(1.22) drop-shadow(0 0 16px rgba(255,214,110,.95))', offset: .7 }, { filter: 'brightness(1.35) drop-shadow(0 0 22px rgba(255,240,170,1))' }], { duration: 520, easing: 'ease-in' });
    whoosh(0, .5, .22, 300, 1300);
    add({ dur: .52, draw(p) { const r = 60 + 40 * (1 - p), g = ctx.createRadialGradient(TAC.x, TAC.y, 0, TAC.x, TAC.y, r); g.addColorStop(0, `rgba(255,214,120,${.5 * p})`); g.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(TAC.x - r, TAC.y - r, 2 * r, 2 * r); ctx.restore(); } });
    for (let i = 0; i < 16; i++) { const a = R(0, 6.28), d0 = R(60, 110), dl = R(0, .22); add({ dur: .3 + .1 * R(0, 1), t0: now + dl, draw(p) { const d = d0 * (1 - eo(p)); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,226,140,${.9 * (1 - p * .3)})`; ctx.beginPath(); ctx.arc(TAC.x + Math.cos(a) * d, TAC.y + Math.sin(a) * d * .8, 2.4 * (1 - p) + .8, 0, 7); ctx.fill(); ctx.restore(); } }); }
  });
  at(1.05, () => { // the card kicks as the effect leaves it
    anim([{ transform: `${T} scale(1)` }, { transform: `${T} translateY(8px) scale(.95)`, offset: .25 }, { transform: `${T} scale(1)` }], { duration: 300 });
    flash(TAC.x, TAC.y, 110, '255,225,150', .6, .3); onLaunch();
  });
}
function leaveTactic(delay) { // it burns away into the graveyard
  at(delay, () => { if (!tacEl) return; const im = tacEl; const a = im.animate([{ opacity: 1, filter: 'brightness(1.6)' }, { opacity: 0, filter: 'brightness(.6) blur(2px)', transform: 'translate(-50%,-62%) scale(.9)' }], { duration: 700, fill: 'forwards' }); a.playbackRate = speed; sparks(TAC.x, TAC.y, 10, .5, '255,190,90'); });
}

              at(T2, () => { explosion(tx, ty + 4, +e.dataset.y < 80 ? .5 : .38, 0, Math.random() < .5 ? 1 : -1); flash(tx, ty, 60, '255,190,90', .5, .2); sparks(tx, ty, 5, .5); play('dano', 0, .22, 1.2 + R(0, .4));

      const a = { x: 195, y: ROW.pFront - 40 }, b = { x: 195, y: ROW.eFront + 40 }, T = .55;
      add({ dur: T + .35, draw(p) {
        const u = eo(clamp(p / (T / (T + .35)))), x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u, fade = 1 - ei((p - .75) / .25);
        ctx.save(); ctx.globalAlpha = fade; ctx.strokeStyle = 'rgba(255,60,50,.95)'; ctx.fillStyle = 'rgba(255,60,50,.95)'; ctx.lineWidth = 5; ctx.shadowColor = 'rgba(255,40,30,.9)'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(x, y + 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x - 13, y + 14); ctx.lineTo(x + 13, y + 14); ctx.closePath(); ctx.fill(); ctx.restore(); } });
      const e = cardByPos(195, ROW.eFront);

};

let current = null;
function runScene(k) {
  audio();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.a === k));
  fxs.length = 0; sched.length = 0; now = 0; $('#nums').innerHTML = '';
  els.forEach(e => e.classList.remove('hit', 'hit2', 'windup', 'kick')); if (tacEl) { tacEl.remove(); tacEl = null; }
  current = k; $('#cap').textContent = scenes[k].cap;
  speed = $('#slow').checked ? .25 : 1;
  scenes[k].run();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => runScene(b.dataset.a));

// ── main loop (`?manual` lets a test advance time by hand with window.__step(seconds)) ───────────────────────────────
function tick(dt) {
  now += dt * speed;
  for (let i = sched.length - 1; i >= 0; i--) if (sched[i].t <= now) { const s = sched.splice(i, 1)[0]; s.fn(); }
  ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < fxs.length; i++) {
    const f = fxs[i], p = (now - f.t0) / f.dur;
    if (p >= 1) { f.end && f.end(); fxs.splice(i, 1); i--; continue; }
    if (p >= 0) f.draw(p);
  }
}
let lastT = performance.now();
if (!q.has('manual')) (function loop(t) { tick(Math.min(.05, (t - lastT) / 1000)); lastT = t; requestAnimationFrame(loop); })(lastT);
window.__step = (s) => { speed = 1; const n = Math.round(s / (1 / 60)); for (let i = 0; i < n; i++) tick(1 / 60); };
window.__run = (k) => { runScene(k); speed = 1; };
ready.then(() => { if (q.get('run')) runScene(q.get('run')); });
</script>
