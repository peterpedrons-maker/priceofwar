<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Price of War</title>

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Price of War" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Rede de segurança: se o jogo não aparecer (erro ao carregar um arquivo, por exemplo), mostra o motivo em vez de tela preta.
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) errs.push('não carregou: ' + (t.src || t.href).split('/').slice(-2).join('/'));   // arquivo que falhou (404, sem rede)
          else errs.push((e.message || 'erro') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { errs.push('promessa: ' + (e.reason && e.reason.message || e.reason)); });
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.innerText.trim() && !r.querySelector('img,canvas,button,svg')) {
            var d = document.createElement('div');
            d.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:#0c0906;color:#f3e7c6;font-family:Georgia,serif;text-align:center;z-index:99999';
            d.innerHTML = '<div style="font-size:20px;font-weight:700">O jogo não carregou · The game did not load</div><pre style="max-width:92vw;max-height:40vh;overflow:auto;font-size:11px;text-align:left;white-space:pre-wrap;background:rgba(0,0,0,.5);border:1px solid #6b5420;border-radius:8px;padding:10px"></pre><button style="padding:12px 20px;border-radius:10px;border:2px solid #e8c766;background:#b98a2c;color:#2a1a06;font-weight:900" onclick="location.replace(location.pathname + \'?r=\' + Date.now())">Recarregar · Reload</button>';
            d.querySelector('pre').textContent = errs.length ? errs.slice(0, 6).join('\n') : 'Sem erro registrado. Verifique a internet e recarregue.';
            document.body.appendChild(d);
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
