name: Keep Supabase awake

# Pelo que sei, o plano grátis do Supabase PAUSA o projeto depois de cerca de uma semana sem nenhum acesso, e o jogo online para de funcionar até alguém reativar.
# Este aviso a cada 3 dias evita isso nas semanas em que ninguém joga. Usa só a URL e a chave pública (anon) que já estão em "Price of War/.env.production" (a chave anon é pública por desenho).
# Se o GitHub desligar workflows agendados por falta de atividade no repositório (isso acontece depois de ~60 dias sem commits), basta reativar em Actions.

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the Supabase API
        run: |
          set -eu
          URL=$(grep '^VITE_SUPABASE_URL=' "Price of War/.env.production" | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' "Price of War/.env.production" | cut -d= -f2-)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::URL ou chave não encontradas em .env.production"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" "$URL/rest/v1/")
          echo "Supabase respondeu $code"
          # 2xx/4xx = o projeto está acordado (4xx só significa "sem permissão para listar", o que é esperado); 5xx ou 000 = algo errado/pausado
          case "$code" in 2*|4*) exit 0;; *) echo "::error::O Supabase não respondeu bem ($code). O projeto pode estar pausado: abra o painel e clique em Restore."; exit 1;; esac
