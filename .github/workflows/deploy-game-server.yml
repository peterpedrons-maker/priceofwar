name: Deploy game server (Supabase Edge Function)

# Publishes supabase/functions/game to the Supabase project every time it changes on these branches
# (and whenever the workflow is re-run). Needs ONE repository secret: SUPABASE_ACCESS_TOKEN
# (Supabase dashboard -> Account -> Access Tokens -> Generate new token).

on:
  push:
    branches:
      - main
      - claude/price-of-war-project-xgzrn3
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-game-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-game-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ljytihmtsaagsxzhlmsg
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing the SUPABASE_ACCESS_TOKEN secret. Add it in GitHub: Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the game function
        run: supabase functions deploy game --project-ref "$PROJECT_REF" --no-verify-jwt
